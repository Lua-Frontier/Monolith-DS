# A floating, singular grid, useful for space junk or asteroids
- type: entity
  id: NFBaseDebris
  abstract: true
  components:
  - type: OwnedDebris
  - type: LocalityLoader
  - type: GCAbleObject
    queue: SpaceDebris
  - type: MapGrid
  - type: LinkedLifecycleGridParent
  - type: ProtectedGrid
    preventArtifactTriggers: true
#  - type: PreventPilot # Mono: FUN ALLOWED
  - type: IFF
    flags: HideLabel, HideLabelAlways, AlwaysShowColor
#  - type: ClaimableGrid # Mono # LuaM: asteroids can't be claimed, the wrecks keep it in wrecks.yml
  - type: DetectedAtRangeMultiplier # Mono
    visualBias: 1024
