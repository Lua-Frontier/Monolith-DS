- type: entity
  parent: DoubleEmergencyOxygenTank
  id: DoubleEmergencyAirTank
  name: double emergency air tank
  description: A high-grade dual-tank emergency life support container. It holds a decent amount of air for it's small size.
  components:
  - type: Sprite
    sprite: _NF/Objects/Tanks/emergency_double_air.rsi
  - type: Item
    sprite: _NF/Objects/Tanks/emergency_double_air.rsi
  - type: Clothing
    sprite: _NF/Objects/Tanks/emergency_double_air.rsi
  - type: StaticPrice # To keep with upstream on it
    price: 32.5

- type: entity
  parent: GasTankBase
  id: BluespaceAirTank
  name: bluespace air tank
  description: A bluespace expanded gas tank. Holds 20L of gas
  components:
  - type: Sprite
    sprite: _NF/Objects/Tanks/bluespace_air_tank.rsi
  - type: Item
    sprite: _NF/Objects/Tanks/bluespace_air_tank.rsi
  - type: Clothing
    sprite: _NF/Objects/Tanks/bluespace_air_tank.rsi
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 100 # LuaM: 20 > 100
      temperature: 293.15

- type: entity
  parent: DoubleEmergencyAirTank
  id: SmallBluespaceAirTank
  name: pocket bluespace air tank
  description: A pocket sized bluespace gas tank. Holds 10L of gas
  components:
  - type: Sprite
    sprite: _NF/Objects/Tanks/bluespace_pocket_tank.rsi
  - type: Item
    sprite: _NF/Objects/Tanks/bluespace_pocket_tank.rsi
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 50 # LuaM: 10 > 50
      temperature: 293.15