# Base game vehicles
- type: entity
  parent: VehicleATV
  id: VehicleATVNF
  name: ATV
  description: All-Tile Vehicle.
  components:
  - type: Sprite
    sprite: _NF/Objects/Vehicles/atv.rsi
    layers:
    - state: hull
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: engine
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    - state: lights
      shader: unshaded
    noRot: true
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          hull: Sixteen # Rainbow, Emagged, Departmental, Advanced
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - ATVKeys
        priority: 1
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
      bag:
        name: stored bag
        whitelist:
          components:
            - Storage
        priority: 2
        insertSound:
          path: /Audio/Items/belt_equip.ogg
          params:
            volume: -3
  - type: ItemMapper
    mapLayers:
      bag:
        whitelist:
          components:
            - Storage
    sprite: _NF/Objects/Vehicles/atv.rsi
  - type: Appearance
  - type: Strap
    unbuckleDistanceSquared: 0.09 # (30 cm)^2
  - type: Tag # Mono
    tags:
    - DoorBumpOpener

# New Frontier vehicles
- type: entity
  parent: VehicleATVNF
  id: VehicleHoverbikeNF
  name: hoverbike
  description: A turbine with bike handles. Very safe.
  components:
  - type: MovementAlwaysTouching
  - type: CanMoveInAir
  - type: AmbientSound
    sound: /Audio/Effects/shuttle_thruster.ogg
    range: 8
    volume: 5
    enabled: false
  - type: Strap
    buckleOffset: "0.1, -0.05"
    # maxBuckleDistance: 1 # Umbra - buckling fix
  - type: MovementSpeedModifier
    baseAcceleration: 1.5
    baseFriction: 1
    baseWalkSpeed: 3.5
    baseSprintSpeed: 6
    baseWeightlessAcceleration: 1
    baseWeightlessFriction: 0.05
    weightlessFrictionNoInput: 0.05
    baseWeightlessModifier: 3
  - type: Sprite
    sprite: _NF/Objects/Vehicles/hoverbike.rsi
    layers:
    - state: hull
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: engine
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    - state: lights
      shader: unshaded
    noRot: true
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          hull: Sixteen # Rainbow, Emagged, Departmental, Advanced
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - HoverbikeKeys
        priority: 1
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -5
      bag:
        name: stored bag
        whitelist:
          components:
            - Storage
        priority: 2
        insertSound:
          path: /Audio/Items/belt_equip.ogg
          params:
            volume: -3
  - type: ItemMapper
    mapLayers:
      bag:
        whitelist:
          components:
            - Storage
    sprite: _NF/Objects/Vehicles/hoverbike.rsi
  - type: Appearance
  - type: PointLight
    radius: 7
    energy: 3
  - type: Tag # Mono
    tags:
    - DoorBumpOpener

