# Ballistic ammunition used by Unitology (The Circle).
# These prototypes intentionally use Monolith's physical projectile pipeline.

- type: Tag
  id: CartridgeZastabaNosle

- type: Tag
  id: CartridgeRPL20

- type: Tag
  id: CartridgeASh12

- type: Tag
  id: CartridgeRifleSCARAB

- type: Tag
  id: CartridgeBulletVSK

- type: entity
  id: BaseCartridgeRifleZastaba
  name: cartridge (5.7x39 mm)
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeZastabaNosle
  - type: CartridgeAmmo
    proto: BulletRifleZastaba
  - type: Sprite
    sprite: _LuaM/Necromorfs/TheCircle/Weapon/weapons/zastaba/zastaba-casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: CartridgeRifleZastaba
  name: cartridge (5.7x39 mm)
  parent: BaseCartridgeRifleZastaba

- type: entity
  id: BulletRifleZastaba
  name: bullet (5.7x39 mm)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/TheCircle/Weapon/weapons/zastaba/zastaba-projectile.rsi
    layers:
    - state: heavy-bullet-5.7
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 15
        Blunt: 4
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: StaminaDamageOnCollide
    damage: 15

- type: entity
  id: BulletRSh2
