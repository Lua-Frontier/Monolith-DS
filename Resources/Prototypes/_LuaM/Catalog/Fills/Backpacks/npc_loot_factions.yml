# Loot boxes of the Vanguard and TSF fauna, worn instead of their empty backpacks.
# Regular fauna: the syndicate operative loot boxes A-D (copied, the item list can not be extended by inheritance)
# plus a 5% chance of a small monolith crystal.
# Shielded fauna (CV-53 and M-92X): the syndicate operative loot A, a 5% chance of the ammo their own guns use,
# 5% of a medium and 10% of a small monolith crystal.

## Vanguard

- type: entity
  parent: ClothingBackpackSyndicateOperativeLootA
  id: ClothingBackpackPDVLootA
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Back/Backpacks/pdv.rsi
    state: icon
  - type: SpawnItemsOnUse
    items:
      - id: WeaponSubMachineGunAtreidesExpedition
      - id: Magazine57x28mmSubMachineGunFMJ
      - id: Magazine57x28mmSubMachineGunFMJ
      - id: SpaceCash1000
      - id: SpaceCash1000
      # Bonus loot
      - id: SpaceCash10000
      - id: SpaceCash1000
        prob: 0.9
      - id: SpaceCash500
        prob: 0.9
      - id: SpaceCash1000
        prob: 0.7
      - id: SpawnDungeonLootMaterialsValuableFull
        prob: 0.7
      - id: SpawnDungeonLootPartsEngi
        amount: 2
        prob: 0.7
      - id: SpawnDungeonLootFlatpacks
        prob: 0.5
      - id: SpawnDungeonLootToolsAdvancedEngineering
        prob: 0.4
      - id: WeaponRifleMR8C
        prob: 0.05
      - id: MonolithicCrystalSmall
        prob: 0.05
    sound:
      path: /Audio/Items/jumpsuit_equip.ogg

