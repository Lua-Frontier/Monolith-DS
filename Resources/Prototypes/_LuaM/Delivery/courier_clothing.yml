- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatLuaMCourier
  name: courier cap
  description: A thick yellow baseball cap with a black brim and the ColossDelivery logo. The brim keeps its shape even after a couple of fights over a parcel.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCourier
  # LuaM-end
  - type: Sprite
    sprite: _LuaM/Clothing/Head/Hats/courier_cap.rsi
  - type: Clothing
    sprite: _LuaM/Clothing/Head/Hats/courier_cap.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitLuaMCourier
  name: courier uniform
  description: A yellow and black ColossDelivery work uniform. Heavy tunic with shoulder pads, a tie and trousers with knee pads.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCourier
  # LuaM-end
  - type: Sprite
    sprite: _LuaM/Clothing/Uniforms/Jumpsuit/courier.rsi
  - type: Clothing
    sprite: _LuaM/Clothing/Uniforms/Jumpsuit/courier.rsi
  - type: SuitSensor
    mode: SensorCords

- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterCoatLuaMCourier
  name: courier jacket
  description: A heavy yellow synthleather jacket with a black collar and the ColossDelivery logo on the back. Softens blows and cuts a little.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCourier
  # LuaM-end
  - type: Sprite
    sprite: _LuaM/Clothing/OuterClothing/Coats/courier_jacket.rsi
  - type: Clothing
    sprite: _LuaM/Clothing/OuterClothing/Coats/courier_jacket.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9

- type: entity
  parent: NFClothingBackpack
  id: ClothingBackpackLuaMCourierThermobag
  name: courier thermobag
  description: A square insulated courier bag with the ColossDelivery logo. Food inside stays fresh.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCourier
  # LuaM-end
  - type: Sprite
    sprite: _LuaM/Clothing/Back/Backpacks/courier_thermobag.rsi
  - type: Clothing
    sprite: _LuaM/Clothing/Back/Backpacks/courier_thermobag.rsi
  - type: Storage
    maxItemSize: Huge
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,7,4
  - type: Item
    size: Huge
    shape:
    - 0,0,7,5
  - type: AntiRottingContainer

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakLuaMCourier
  name: ColossDelivery cloak
  description: A black corporate cloak with a yellow ColossDelivery logo on the back. Purely for show.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCourier
  # LuaM-end
  - type: Sprite
    sprite: _LuaM/Clothing/Neck/Cloaks/courier_cloak.rsi
  - type: Clothing
    renderLayer: belt # under the backpack

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakLuaMCourierYellow
  name: yellow ColossDelivery cloak
  description: A bright yellow formal cloak with black stripes in ColossDelivery colours. Purely for show.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCourier
  # LuaM-end
  - type: Sprite
    sprite: _LuaM/Clothing/Neck/Cloaks/courier_cloak_yellow.rsi
  - type: Clothing
    renderLayer: belt # under the backpack

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesHudLuaMCourier
  name: courier HUD
  description: A ColossDelivery heads-up display. Marks the customers of the orders you carry with a spinning target ring.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCourier
  # LuaM-end
  - type: Sprite
    sprite: _LuaM/Clothing/Eyes/Hud/courier.rsi
  - type: Clothing
    sprite: _LuaM/Clothing/Eyes/Hud/courier.rsi
  - type: DeliveryGoggles
