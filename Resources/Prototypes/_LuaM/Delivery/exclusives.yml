- type: entity
  parent: FoodMeatBase
  id: FoodLuaMMinceRaw
  name: raw mince
  description: Raw minced pork. Better fry it before eating.
  components:
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: Sprite
    sprite: _LuaM/Objects/Consumable/Food/coloss_delivery.rsi
    state: mince_raw
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 8
        - ReagentId: Fat
          Quantity: 4
  - type: InternalTemperature
    conductivity: 0.43
    thickness: 0.01
    area: 0.01
  - type: Construction
    graph: LuaMMince
    node: start
    defaultTarget: cooked

- type: entity
  parent: FoodMeatBase
  id: FoodLuaMMinceCooked
  name: mince
  description: Fried minced pork. Simple and filling.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Sprite
    sprite: _LuaM/Objects/Consumable/Food/coloss_delivery.rsi
    state: mince_cooked
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 10
  - type: Construction
    graph: LuaMMince
    node: cooked

- type: constructionGraph
  id: LuaMMince
  start: start
  graph:
  - node: start
    edges:
    - to: cooked
      completed:
      - !type:PlaySound
        sound: /Audio/Effects/sizzle.ogg
      steps:
      - minTemperature: 345
  - node: cooked
    entity: FoodLuaMMinceCooked

- type: entity
  parent: DrinkBottlePlasticBaseFull
  id: DrinkLuaMKvassBottle
  name: kvass barrel
  description: A plastic barrel of live-fermented bread kvass, 1.5 litres.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 150
        reagents:
        - ReagentId: LuaMKvass
          Quantity: 150
  - type: Label
    currentLabel: reagent-name-luam-kvass
  - type: Sprite
    sprite: _LuaM/Objects/Consumable/Drinks/kvass.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon_open"}
          False: {state: "icon"}
  - type: Sealable
