# Contractor weapons: the full choice of the old mercenary role plus the contractor self-defense guns.
# The pistol and ammo lists come in as subgroups, so they stay in sync with the mercenary role.
# MercenaryFirearm is copied without the Iroh, the contractor gets it only as a special weapon.
- type: loadoutGroup
  id: ContractorFullFirearm
  name: loadout-group-weapon
  minLimit: 0
  loadouts:
  - MercenaryGestioLoadout
  - MercenaryNovaliteLoadout
  - MercenaryAk220Loadout
  - MercenaryKnallstockLoadout
  - MercenaryKeyboardLoadout
  - MercenaryPrometheusLoadout
  - MercenaryLeeEnfieldLoadout
  - MercenaryVulcanCLoadout
  - MercenaryMosinLoadout
  - MercenarySvsLoadout
  - MercenaryKammererLoadout
  - MercenaryDisablerSMGLoadout
  - MercenaryLaserCarbineLoadout
  - MercenaryEnergyGunLoadout
  - MercenaryLeverActionloadout
  - ContractorDoubleBarreledLoadout
  - ContractorAkmLoadout

- type: loadoutGroup
  id: ContractorFullPistol
  name: loadout-group-pistol
  minLimit: 0
  loadouts:
  - ContractorMk32Loadout
  - ContractorSvalinnLoadout
  - ContractorSurvivalKnifeLoadout
  subgroups:
