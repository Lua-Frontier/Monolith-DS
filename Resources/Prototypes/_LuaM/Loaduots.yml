- type: loadout
  id: ContractorSpecialWeapon101
  name: Hunter-101 gun case
  effects:
  - !type:GroupLoadoutEffect
    proto: MonoCivPro
  price: 250000
  inhand:
  - WeaponCaseHunter101Registered

- type: loadout
  id: ContractorSpecialGunIroh
  effects:
  - !type:GroupLoadoutEffect
    proto: MonoCivSkilled
  price: 100000 # same as the old mercenary Iroh, it's premium
  inhand:
  - WeaponCaseLongIrohRegistered

# Special weapon for Viper Group veterans: 10 hours in the Viper Group.
- type: loadoutEffectGroup
  id: LuaMViperGroupVet
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: ViperGroup
      time: 36000 # 10 hrs

- type: loadout
  id: ContractorSpecialGunAK12
  effects:
  - !type:GroupLoadoutEffect
    proto: LuaMViperGroupVet
  price: 75000
  inhand:
  - WeaponCaseLongAK12Registered

- type: loadout
  id: ContractorAkmLoadout
  price: 15000 # same as the Prometheus, a full-auto rifle as well
  storage:
    back:
    - WeaponRifleAk

# VG weapons: MercenaryFirearm (shared with other jobs, so it is copied here) plus the mercenary self-defense guns
