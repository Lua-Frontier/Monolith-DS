  - MercenaryMosinLoadout
  - MercenarySvsLoadout
  - MercenaryKammererLoadout
  - MercenaryDisablerSMGLoadout
  - MercenaryLaserCarbineLoadout
  - MercenaryMercLaserCarbineLoadout
  - MercenaryEnergyGunLoadout
  - MercenaryLeverActionloadout
