  - MercenaryNovaliteLoadout
  - MercenaryAk220Loadout
  - MercenaryKnallstockLoadout
  - MercenaryKeyboardLoadout
  - MercenaryPrometheusLoadout
  - MercenaryLeeEnfieldLoadout
  - MercenaryVulcanCLoadout
  - MercenaryMosinLoadout
  - MercenarySvsLoadout
  - MercenaryKammererLoadout
  - MercenaryDisablerSMGLoadout
  - MercenaryLaserCarbineLoadout
