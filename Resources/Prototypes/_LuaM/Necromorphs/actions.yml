- type: entity
  id: ActionAbsorptionDeadNecro
  name: Поглотить некроморфа
  description: Поглотите некроморфа, чтобы создать симбиоз.
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    useDelay: 5
    icon:
      sprite: Interface/Actions/devour.rsi
      state: icon
    event: !type:AbsorptionDeadNecroActionEvent

- type: entity
  id: ActionInfectionNecro
  name: Заразить существо
  description: Заражает мёртвое существо инфекцией, или лечит/воскрешает некроморфа.
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    useDelay: 5
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_damtype_toxin
    event: !type:InfectionNecroActionEvent

- type: entity
  id: ActionSpawnPointNecro
  name: Призвать некроморфа
  description: Отсоеденить ранее поглощенного некроморфа.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 30
    icon: _LuaM/Interface/Actions/slash.png
    event: !type:SpawnPointNecroActionEvent

- type: entity
  id: ActionDevaEnrage
  name: Бешенство
  description: Вы впадаете в бешенство и пытаетесь сьесть ближайшего противника!
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 30
    icon: _LuaM/Interface/Actions/deva.png
    itemIconStyle: NoItem
    event: !type:DevaEnrageActionEvent

- type: entity
  id: ActionSelectTargetRecruitment
  name: Начать вербовку
  description: Провести ритуал по вербовки нового члена смертника-юнитологии.
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    useDelay: 3
    icon:
      sprite: /Textures/_LuaM/Interface/Misc/antag_icons.rsi
      state: UnitologyHead
    checkCanAccess: false
    range: 1
    event: !type:SelectTargetRecruitmentEvent

- type: entity
  id: ActionReturnToBody
  name: Вернуться к своему телу
  description: Телепортирует вас к привязанной сущности.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 5
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_overload_off
    event: !type:ReturnToBodyEvent

- type: entity
  id: ActionUnitologyHead
  name: Передать знания
  description: Ментально передаёт свою роль и знания другому смертнику-юнитологу.
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    useDelay: 5
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_overload_off
    range: 2
    checkCanAccess: false
    event: !type:UnitologyHeadActionEvent

- type: entity
  id: ActionOrderToSlave
  name: Ограничить раба
  description: Снять или дать ограничения в движении рабу.
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    useDelay: 5
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: ratKingArmy
    range: 10
    checkCanAccess: false
    event: !type:OrderToSlaveActionEvent

- type: entity
  id: ActionSpawnLeviathan
  name: Стать левиафаном
  description: Вы пожрали множество существ и готовы стать левиафаном.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 20
    priority: -1
    icon: _LuaM/Interface/Actions/leviathan.png
    event: !type:SpawnLeviathanActionEvent

- type: entity
  id: ActionHiveRaiseArmy
  name: Улей
  description: Создать личинку!
  components:
  - type: InstantAction
    useDelay: 1
    icon: _LuaM/Necromorfs/larva.png
    event: !type:RatKingRaiseArmyActionEvent

- type: entity
  id: ActionHiveDomain
  name: Пустить газ
  description: Выпускает некрогаз в пространство.
  components:
  - type: InstantAction
    useDelay: 120
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: ratKingDomain
    event: !type:RatKingDomainActionEvent

- type: entity
  id: ActionHiveOrderStay
  name: Остановить
  description: Команда для подконтрольных существ.
  components:
  - type: InstantAction
    useDelay: 1
    icon: _LuaM/Interface/Actions/stayOff.png
    iconOn: _LuaM/Interface/Actions/stay.png
    priority: 5
    event: !type:RatKingOrderActionEvent
      type: Stay

- type: entity
  id: ActionHiveOrderFollow
  name: За мной
  description: Команда для подконтрольных существ.
  components:
  - type: InstantAction
    useDelay: 1
    icon: _LuaM/Interface/Actions/followOff.png
    iconOn: _LuaM/Interface/Actions/follow.png
    priority: 6
    event: !type:RatKingOrderActionEvent
      type: Follow

- type: entity
  id: ActionHiveOrderCheeseEm
  name: Атака
  description: Команда для подконтрольных существ.
  components:
  - type: InstantAction
    useDelay: 1
    icon: _LuaM/Interface/Actions/attackOff.png
    iconOn: _LuaM/Interface/Actions/attack.png
    priority: 7
    event: !type:RatKingOrderActionEvent
      type: CheeseEm

- type: entity
  id: ActionHiveOrderLoose
  name: Вольно
  description: Команда для подконтрольных существ.
  components:
  - type: InstantAction
    useDelay: 1
    icon: _LuaM/Interface/Actions/looseOff.png
    iconOn: _LuaM/Interface/Actions/loose.png
    priority: 8
    event: !type:RatKingOrderActionEvent
      type: Loose
