# Colossus station staff. Kept apart from the TSF levels (Security, Brig, HeadOfSecurity...),
# so the station guards and the commandant don't open TSF doors and the TSF doesn't open the station.

- type: accessLevel
  id: ColossusSecurity
  name: id-card-access-level-colossus-security

- type: accessLevel
  id: ColossusCommand
  name: id-card-access-level-colossus-command

