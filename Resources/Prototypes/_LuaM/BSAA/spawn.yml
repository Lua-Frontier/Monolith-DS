# Настройки спавна
- type: randomHumanoidSettings
  id: BSAALeader
  parent: EventHumanoidMindShielded # LuaM: EventHumanoidERTZombieImmune > EventHumanoidMindShielded
  components:
    - type: GhostRole
      name: Лидер АПБТ
      description: ghost-role-information-cburn-leader-description
      rules: ghost-role-information-nonantagonist-rules
      # LuaM: закомментировано временно — нет поля category в GhostRoleComponent
      # category: ghost-role-information-centcomm-category
      raffle:
        settings: short
      job: BSAALeaderJob
    - type: RandomMetadata
      nameSegments:
      - NamesMilitaryFirstLeader # LuaM: NamesFirstERTLeader > NamesMilitaryFirstLeader
      - NamesMilitaryLast # LuaM: NamesLastERT > NamesMilitaryLast
      nameFormat: name-format-standard # LuaM: name-format-ert > name-format-standard
    # LuaM: закомментировано временно — нет компонента ImmunNecroobelisk
    # - type: ImmunNecroobelisk
    - type: IgnoreKudzu
    - type: Loadout
      prototypes: [ BSAALeaderGear ]
    # LuaM: закомментировано временно — нет компонента GhostRoleNotifys
    # - type: GhostRoleNotifys 
    #   groupPrototype: BSAAGroup
    - type: AutoImplant
      implants:
      - MindShieldImplant
      - TrackingImplant
      # LuaM: закомментировано временно — нет прототипа RadioImplantSOC
      # - RadioImplantSOC
      # LuaM: закомментировано временно — нет прототипа DeathRattleImplantSOD
      # - DeathRattleImplantSOD
      # LuaM: закомментировано временно — нет прототипа RezervImplant
      # - RezervImplant

