# Настройки спавна
- type: randomHumanoidSettings
  id: BSAALeader
  parent: EventHumanoidMindShielded
  components:
    - type: GhostRole
      name: Лидер АПБТ
      description: ghost-role-information-cburn-leader-description
      rules: ghost-role-information-nonantagonist-rules
      category: ghost-role-information-centcomm-category
      raffle:
        settings: short
      job: BSAALeaderJob
    - type: RandomMetadata
      nameSegments:
      - NamesFirstERTLeader
      - NamesLastERT
      nameFormat: name-format-ert
    - type: Loadout
      prototypes: [ BSAALeaderGear ]
    - type: AutoImplant
      implants:
      - MindShieldImplant
      - TrackingImplant

- type: randomHumanoidSettings
