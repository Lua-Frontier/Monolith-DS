# плюшка

- type: entity
  parent: BasePlushie
  id: EventPlushieEsther
  name: плюшевая Эстер цум Афслёйтдейк
  description: FUCKED UP HEAD AND BPD GIRL I KNOW YOU WANTED ME. Хочется пожать ей руку.
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/TheCircle/Gear/accessories/plushies.rsi
    state: plushie_esther
  - type: TTS
    # LuaM: закомментировано временно — нет поля voices в TTSComponent
    # voices:
    #   silero: Lunara
    #   # LuaM: закомментировано временно — нет прототипа NTTSWindrangerDota2
    #   # ntts: NTTSWindrangerDota2
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Ambience/Antag/nukeops_start.ogg
      params:
        volume: -2
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Ambience/Antag/nukeops_start.ogg
      params:
        volume: -2
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Ambience/Antag/nukeops_start.ogg
      params:
        volume: -2
  - type: UseDelay
    delay: 15.0

- type: entity
  id: WeaponryTechFabBSAA
  parent: BaseLatheLube
  name: оружейный техфаб АПБТ
  description: С него так и веет жаром.
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/BSAA/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: sec
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: Machine
    board: WeaponryTechFabCircuitboardBSAA
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - BSAAAmmoStatic
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient

- type: entity
  id: WeaponryTechFabCircuitboardBSAA
  parent: BaseMachineCircuitboard
  name: оружейный ТехФаб АПБТ (машинная плата)
  description: Печатная плата оружейного ТехФаба.
  components:
  - type: MachineBoard
    prototype: WeaponryTechFabBSAA
    stackRequirements:
      Manipulator: 4
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker
