  name: Набор Синабир-410
  description: В данный набор входит новейшая разработка NT по заказу КСО для особого отряда — Синабир-410 — скорострельный магазинный дробовик с убойной силой, способный раздробить кости посмевших напасть биотеррористов.
  sprite:
    sprite: _LuaM/Necromorfs/BSAA/weapons/Sinabir/Sinabir.rsi
