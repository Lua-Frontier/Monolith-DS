  - MagazineCaselessRifleBurn
  - MagazineCaselessRifleBurn
  - AmmoBox635x40mmCaseless # LuaM: MagazineBoxCaselessRifle > AmmoBox635x40mmCaseless
  - MagazineBoxCaselessRifleDragon

