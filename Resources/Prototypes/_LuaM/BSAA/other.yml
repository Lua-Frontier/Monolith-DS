# База кейсов ERT из dead-space-14 (_DeadSpace/Entities/Other/ertloadouts.yml)
- type: entity
  parent: BaseItem
  id: BaseERTloadoutPrimary
  abstract: true
  name: кейс неопределённости
  description: Прочный военный кейс для оружия.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _LuaM/Other/ertloadouts/ertcases.rsi
    state: amber
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 1
    # possibleSets:  # LuaM: всё содержимое закомментировано
    # LuaM: закомментировано временно — нет прототипа KammererSet
    # - KammererSet
    # LuaM: закомментировано временно — нет прототипа DrozdSet
    # - DrozdSet
    # LuaM: закомментировано временно — нет прототипа LaserCarbineSet
    # - LaserCarbineSet
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_LuaM/Items/Handing/cardboardbox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_LuaM/Items/Handing/cardboardbox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_LuaM/Items/Handing/cardboardbox_drop.ogg

# Гипо Медика и сумка
- type: entity
  parent: BaseItem
  id: BSAAHypo
  name: гипоспрей АПБТ
  description: Спроектированный на основе боевого стандарта NT инструмент быстрого впрыска с уменьшенным объёмом.
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/BSAA/misc/bsaa-hypo.rsi
    state: icon
  - type: Item
    sprite: _LuaM/Necromorfs/BSAA/misc/bsaa-hypo.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    # LuaM: закомментировано временно — нет прототипа HyposprayDynamicMode
    # activeModeProtoId: HyposprayDynamicMode
    # allowedModes:  # LuaM: всё содержимое закомментировано
    # LuaM: закомментировано временно — нет прототипа HyposprayDynamicMode
    # - HyposprayDynamicMode
    # LuaM: закомментировано временно — нет прототипа HyposprayInjectMode
    # - HyposprayInjectMode
  - type: UseDelay
    delay: 1.0

- type: entity
  id: BSAAloadout
  name: кейс неопределённости
  description: Прочный военный кейс для оружия. Принадлежит отряду АПБТ.
  suffix: АПБТ, Основное
  parent: BaseERTloadoutPrimary
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/BSAA/misc/misc.rsi
    state: case
  - type: ThiefUndeterminedBackpack
    possibleSets:
    - SinabirSet
    - TochmashAndVANTSet
    - AresSet
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

- type: entity
  id: BSAAJugFlame
  suffix: топливо для огнемёта
  parent: JugTheCircle
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        reagents:
        - ReagentId: Napalm
          Quantity: 270
        - ReagentId: Phlogiston
          Quantity: 30

