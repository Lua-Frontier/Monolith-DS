# Магнитки
- type: entity
  parent: ClothingShoesBootsMagAdv # LuaM: ADTClothingShoesBootsMagERT > ClothingShoesBootsMagAdv
  id: ClothingShoesBootsMagBSAA
  name: магнитные сапоги АПБТ
  description: Продвинутые магнитные ботинки, не замедляющие своего владельца.
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/BSAA/clothing/magboots.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _LuaM/Necromorfs/BSAA/clothing/magboots.rsi

# Противогаз
- type: entity
  parent: ClothingMaskGas
  id: ClothingMaskBSAA
  name: противогаз АПБТ
  description: Специальный противогаз АПБТ.
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/BSAA/clothing/mask.rsi
  - type: Clothing
    sprite: _LuaM/Necromorfs/BSAA/clothing/mask.rsi
  # LuaM: закомментировано временно — нет компонента SpecialDeathSound
  # - type: SpecialDeathSound
  #   sound:
  #     path: /Audio/_LuaM/Voice/Death/sec_death.ogg
  - type: ActionGrant
    # actions:  # LuaM: всё содержимое закомментировано
    # LuaM: закомментировано временно — нет прототипа ActionGasMaskDispatch
    # - ActionGasMaskDispatch
  - type: ItemActionGrant
    # actions:  # LuaM: всё содержимое закомментировано
    # LuaM: закомментировано временно — нет прототипа ActionGasMaskDispatch
    # - ActionGasMaskDispatch
    activeIfWorn: true
  # LuaM: закомментировано временно — нет компонента GasMaskDispatch
  # - type: GasMaskDispatch
  #   channel: SOCChannel
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
    hideOnToggle: true
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95
        Heat: 0.95

