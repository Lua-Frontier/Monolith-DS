# Рюкзак
- type: entity
  parent: ClothingBackpack
  id: ClothingBSAABackpack
  name: продвинутый рюкзак АПБТ
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/BSAA/clothing/backpack.rsi
  - type: Storage
    grid:
    - 0,0,9,5
  - type: Tag
    tags: []
  - type: ExplosionResistance
    damageCoefficient: 0.1

# Мантия
- type: entity
  parent: [ ClothingNeckBase, BaseCommandContraband ]
  id: BSAALeaderShoulder
  name: мантия лидера АПБТ
  description: Необычайно украшенная драпировка, отражающая всю мощь альянса. Повисла на шее лидера, обвив объятиями плечи, как личный ангел-хранитель.
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/BSAA/misc/bsaa-mantle.rsi
  - type: Clothing
    sprite: _LuaM/Necromorfs/BSAA/misc/bsaa-mantle.rsi

