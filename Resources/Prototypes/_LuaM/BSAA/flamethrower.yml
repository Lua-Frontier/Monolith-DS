    - FlamethrowerNozzle
  - type: Sprite
    sprite: _LuaM/Objects/Weapons/Guns/Basic/syndie_flamethrower.rsi
    state: icon
  - type: Item
    sprite: _LuaM/Objects/Weapons/Guns/Basic/syndie_flamethrower.rsi
    size: Large
    shape:
    - 0,0,4,1
