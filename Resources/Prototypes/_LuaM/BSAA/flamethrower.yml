- type: entity
  parent: ClothingBackpackWaterTank
  id: ClothingBackpackSyndieFlametank
  name: огнемётный ранец
  description: Комбинированный ранец с жидким топливом и встроенным кислородным баллоном.
  components:
  - type: Tag
    tags:
    - FlamethrowerBackTank
  # LuaM: закомментировано временно — нет компонента FlamethrowerFuelTank
  # - type: FlamethrowerFuelTank
  - type: Sprite
    sprite: _LuaM/Objects/Tanks/Flamethrower/syndie_flametank.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: _LuaM/Objects/Tanks/Flamethrower/syndie_flametank.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: ItemSlots
    slots:
      item:
        priority: 2
        whitelist:
          tags:
          - FlamethrowerNozzle
  - type: DrainableSolution
    solution: tank
  - type: Spillable
    solution: tank

- type: entity
  parent: ClothingBackpackSyndieFlametank
  id: ClothingBackpackSyndieFlametankFilled
  suffix: Заполненный
  components:
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1500
        reagents:
        - ReagentId: Phlogiston
          Quantity: 150
        - ReagentId: Napalm
          Quantity: 1350
