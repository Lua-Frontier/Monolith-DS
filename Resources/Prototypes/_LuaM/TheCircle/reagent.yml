- type: reagent
  id: Extraboril
  name: reagent-name-extraboril
  group: Other
  desc: reagent-desc-extraboril
  physicalDesc: reagent-physical-desc-thick
  flavor: sweet
  color: "#d88fff"
  metabolisms:
    Poison:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 3
      # LuaM: закомментировано временно — нет типа CauseInfectionDead
      # - !type:CauseInfectionDead
      #   conditions:
      #     - !type:ReagentCondition
      #       reagent: Extraboril
      #       min: 15

- type: reaction
  impact: Medium
  id: Ferotohil
  reactants:
    Tricordrazine:
      amount: 1
    Extraboril:
      amount: 1
  products:
    Ferotohil: 1.5

- type: reaction
  impact: Medium
  id: Ferratid
  reactants:
    Dermaline:
      amount: 1.3
    Pyrazine:
      amount: 1.3
    Extraboril:
      amount: 0.4
  products:
    Ferratid: 2

- type: reaction
  id: Punturil
  impact: Medium
  reactants:
    Puncturase:
      amount: 1.5
    Extraboril:
      amount: 0.5
  products:
    Punturil: 2.8

- type: reaction
  id: Depotojil
  impact: Medium
  reactants:
    Ephedrine:
      amount: 1.5
    Extraboril:
      amount: 1.5
  products:
    Depotojil: 3

