- type: reagent
  id: Punturil
  name: reagent-name-punturil
  group: Other
  desc: reagent-desc-punturil
  physicalDesc: reagent-physical-desc-fizzy
  flavor: fizzy
  color: "#d98787"
  metabolisms:
    Medicine:
      metabolismRate: 0.85
      effects:
      # LuaM: закомментировано временно — нет типа ModifyBleed
      # - !type:ModifyBleed
      #   amount: -1.8
      - !type:HealthChange
        damage:
          types:
            Piercing: -5
            Slash: -1
      - !type:HealthChange
        # conditions:  # LuaM: всё содержимое закомментировано
        # LuaM: закомментировано временно — нет типа ReagentCondition
        # - !type:ReagentCondition
        #   reagent: Punturil
        #   min: 6
        damage:
          types:
            Cellular: 2

- type: reagent
  id: Depotojil
  name: reagent-name-depotojil
  group: Other
  desc: reagent-desc-depotojil
  physicalDesc: reagent-physical-desc-energizing
  flavor: sharp
  color: "#5b5b5b"
  metabolisms:
    Narcotic:
      metabolismRate: 0.72
      effects:
      # LuaM: закомментировано временно — нет типа MovementSpeedModifier
      # - !type:MovementSpeedModifier
      #   walkSpeedModifier: 1.4
      #   sprintSpeedModifier: 1.4
      - !type:Jitter
      - !type:HealthChange
        # conditions:  # LuaM: всё содержимое закомментировано
        # LuaM: закомментировано временно — нет типа ReagentCondition
        # - !type:ReagentCondition
        #   reagent: Depotojil
        #   min: 14
        damage:
          types:
            Cellular: 1.5
      - !type:AdjustReagent
        # conditions:  # LuaM: всё содержимое закомментировано
        # LuaM: закомментировано временно — нет типа ReagentCondition
        # - !type:ReagentCondition
        #   reagent: ChloralHydrate
        #   min: 1
        reagent: ChloralHydrate
        amount: -10
      # LuaM: закомментировано временно — нет типа ModifyStatusEffect
      # - !type:ModifyStatusEffect
      #   effectProto: StatusEffectStunned
      #   time: 3
      #   type: Remove
      # LuaM: закомментировано временно — нет типа ModifyKnockdown
      # - !type:ModifyKnockdown
      #   time: 3
      #   type: Remove
      - !type:GenericStatusEffect
        key: StaminaModifier
        component: StaminaModifier
        time: 3
        type: Add
      # LuaM: закомментировано временно — нет типа ModifyStatusEffect
      # - !type:ModifyStatusEffect
      #   effectProto: StatusEffectForcedSleeping
      #   time: 3
      #   type: Remove
      # LuaM: закомментировано временно — нет типа ModifyStatusEffect
      # - !type:ModifyStatusEffect
      #   conditions:
      #   - !type:ReagentCondition
      #     reagent: Haloperidol
      #     max: 0.01
      #   effectProto: StatusEffectDrowsiness
      #   time: 10
      #   type: Remove
    Medicine:
      metabolismRate: 1.2
      effects:
      - !type:ResetNarcolepsy
      - !type:HealthChange
        # conditions:  # LuaM: всё содержимое закомментировано
        # LuaM: закомментировано временно — нет типа TotalDamageCondition
        # - !type:TotalDamageCondition
        #   min: 70 
        damage:
          groups:
            Burn: -1
            Brute: -1

