- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseC3SyndicateContraband ] # LuaM: BaseSyndicateContraband > BaseC3SyndicateContraband
  id: ClothingOuterHardsuitUnitologyCommander
  name: ведущий бронескафандр «Прометей»
  description: Скафандр Кардинала отряда "Круг". От него, как и от обелиска, веет смертью...  После смерти вы превратитесь в некроморфа Собиратель трупов.
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/TheCircle/HardSuit/commander.rsi
  - type: Clothing
    sprite: _LuaM/Necromorfs/TheCircle/HardSuit/commander.rsi
  - type: Item
    size: Huge
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.475
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.38
        Heat: 0.40
        Cold: 0.3
        Radiation: 0.5
        Poison: 0.5
        Caustic: 0.4
  # LuaM: закомментировано временно — нет компонента StaminaResistance
  # - type: StaminaResistance
  #   damageCoefficient: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitUnitologyCommander
  # LuaM: закомментировано временно — нет компонента AutoInjectReagentClothingOnAllowedState
  # - type: AutoInjectReagentClothingOnAllowedState
  #   durationRegenReagents: 120
  #   allowedStates:
  #   - Dead
  #   reagents:
  #     NecromorphMutagenCorpseCollector: 5
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
  # LuaM: закомментировано временно — нет компонента HardsuitIdentification
  # - type: HardsuitIdentification
  #   dissolveOnDnaChange: false
  - type: Speech
  - type: TTS
    # LuaM: закомментировано временно — нет поля voices в TTSComponent
    # voices:
    #   silero: Overwatch
    #   # LuaM: закомментировано временно — нет прототипа NTTSSentrybot
    #   # ntts: NTTSSentrybot

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
