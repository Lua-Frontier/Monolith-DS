- type: entity
  id: Tripwire
  name: растяжка
  description: Тонкий провод, способный мгновенно активировать подключённые мультитулом устройства.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Appearance
  - type: Sprite
    sprite: Structures/Power/Cables/lv_cable.rsi
    state: lvcable_0
    color: "#80808080"
    drawdepth: ThinWire
  - type: CableVis
    node: cordage
  - type: NodeContainer
    nodes:
      cordage:
        !type:CableNode
        # LuaM: закомментировано временно — нет прототипа ExCable
        # nodeGroupID: ExCable
  - type: CableVisualizer
    statePrefix: lvcable_
  # LuaM: закомментировано временно — нет компонента Tripwire
  # - type: Tripwire
  #   port: Pressed
  #   immediateTriggerKey: timer
  #   disarmTime: 10
  #   attachTime: 1
  #   attachedExplosiveFadeTime: 10
  #   detachExplosiveTime: 30
  # LuaM: закомментировано временно — нет компонента TrapIgnore
  # - type: TrapIgnore
  #   factions:
  #   - Necromorfs
  - type: DeviceLinkSource
    range: 3
    ports:
    - Pressed
  - type: StepTrigger
    intersectRatio: 0.1
    requiredTriggeredSpeed: 0
    stepOn: false
  - type: Physics
    bodyType: Static
    canCollide: true
    fixedRotation: true
  - type: Fixtures
    fixtures:
      trigger:
        shape: !type:PhysShapeAabb
          bounds: "-0.48,-0.48,0.48,0.48"
        hard: false
        layer:
        - LowImpassable

- type: entity
  parent: CableStack
  id: TripwireStack
  name: жгут нитей для растяжки
  suffix: Полный
  description: Моток тонкой растяжки.
  components:
  - type: Stack
    stackType: Tripwire
    baseLayer: base
    layerStates:
    - coilex-10
    - coilex-20
    - coilex-30
  - type: Sprite
    state: coilex-30
    layers:
    - state: coilex-30
      map: ["base"]
  - type: Item
    heldPrefix: coilex
  - type: CablePlacer
    cablePrototypeID: Tripwire
    # LuaM: закомментировано временно — нет прототипа ExCable
    # blockingWireType: ExCable
    # LuaM: закомментировано временно — нет поля blacklist в CablePlacerComponent
    # blacklist:
    #   components:
    #   - Tripwire
    # # LuaM: закомментировано временно — нет поля overTile в CablePlacerComponent
    # # overTile: true
  - type: Appearance

- type: entity
  parent: TripwireStack
  id: TripwireStack1
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  parent: GrenadeBase
  id: TripwireExplosiveGrenade
  name: разрывной заряд для растяжки
  description: Разрывной заряд без ручного взрывателя. Срабатывает только после подключения к растяжке.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/grenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  # LuaM: закомментировано временно — нет компонента TimerTrigger
  # - type: TimerTrigger
  #   examinable: false
  - type: ExplodeOnTrigger
    # LuaM: закомментировано временно — нет поля keysIn в ExplodeOnTriggerComponent
    # keysIn:
    # - timer
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 120
    canCreateVacuum: false

# Triggers constructed by the Circle engineer RCD.
- type: entity
  id: BaseCircleRcdTrigger
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Tiles/Misc/floortrap.rsi
    state: floortrapspawn
  - type: Physics
  - type: Fixtures
    fixtures:
      trigger:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: Tag
    tags:
    - HideContextMenu

