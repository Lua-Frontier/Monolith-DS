- type: entity
  parent: BaseItem
  id: BearTrap
  name: капкан
  description: Тяжёлый капкан, который... Стоп, а почему он полупрозрачный?
  components:
  - type: Sprite
    sprite: _LuaM/Necromorfs/TheCircle/Weapon/traps/bear_trap.rsi
    state: idle
    drawdepth: Items
    layers:
    - state: idle
      map: [ "base" ]
  - type: Appearance
  # LuaM: закомментировано временно — нет enum.BearTrapVisuals.Armed
  # - type: GenericVisualizer
  #   visuals:
  #     enum.BearTrapVisuals.Armed:
  #       base:
  #         True: { state: armed }
  #         False: { state: idle }
  # # LuaM: закомментировано временно — нет компонента BearTrap
  # # - type: BearTrap
  # #   armingTime: 1
  # #   stunTime: 10
  # #   minimumOpacity: 0.35
  # #   disarmTime: 15
  # #   damage:
  # #     types:
  # #       Slash: 50
  # # LuaM: закомментировано временно — нет компонента TrapIgnore
  # # - type: TrapIgnore
  # #   factions:
  # #   - Necromorfs
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      trigger:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.35,0.4,0.35"
        hard: false
        layer:
        - LowImpassable
        mask:
        - MobMask
      item:
        shape: !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 30
        mask:
        - ItemMask

- type: entity
  parent: GrenadeBase
  id: TripwireNecroGasGrenade
  name: газовый заряд для растяжки (некрогаз)
  description: Заряженный баллон с некрогазом без ручного взрывателя. Срабатывает только после подключения к растяжке и заполняет газом около десяти тайлов.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/tear_gas.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  # LuaM: закомментировано временно — нет компонента TimerTrigger
  # - type: TimerTrigger
  #   examinable: false
  - type: EmitSoundOnTrigger
    # LuaM: закомментировано временно — нет поля keysIn в EmitSoundOnTriggerComponent
    # keysIn:
    # - timer
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true
  - type: ReleaseGasOnTrigger
    # LuaM: закомментировано временно — нет поля keysIn в ReleaseGasOnTriggerComponent
    # keysIn:
    # - timer
    removeFraction: 0.25
    air:
      volume: 1000
      # moles:  # LuaM: всё содержимое закомментировано
        # LuaM: закомментировано временно — нет прототипа InfectionDeadSpace
        # InfectionDeadSpace: 1039.28
      temperature: 293.15

- type: entity
  parent: TripwireNecroGasGrenade
  id: TripwireFrezonGasGrenade
  name: газовый заряд для растяжки (фрезон)
  description: Заряженный баллон с фрезоном без ручного взрывателя. Срабатывает только после подключения к растяжке и заполняет газом около шести тайлов.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/smoke.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: ReleaseGasOnTrigger
    # LuaM: закомментировано временно — нет поля keysIn в ReleaseGasOnTriggerComponent
    # keysIn:
    # - timer
    removeFraction: 0.25
    air:
      volume: 1000
      moles:
        Frezon: 623.57
      temperature: 293.15

