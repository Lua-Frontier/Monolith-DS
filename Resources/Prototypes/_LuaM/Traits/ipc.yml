# Negative IPC traits.

- type: trait
  id: IpcCorrosionVulnerability
  name: trait-luam-ipc-corrosion-name
  description: trait-luam-ipc-corrosion-desc
  category: Physical
  cost: -2
  speciesWhitelist:
  - IPC
  components:
  - type: DamageProtectionBuff
    modifiers:
      corrosion:
        id: IpcCorrosionVulnerability
        coefficients:
          Caustic: 1.5
