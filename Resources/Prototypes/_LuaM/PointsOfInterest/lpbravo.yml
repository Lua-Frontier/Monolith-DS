- type: pointOfInterest
  id: LPBravo
  parent: BasePOI
  name: 'Прослушка «Браво»'
  minimumDistance: 15000
  maximumDistance: 17000
  spawnGroup: SyndicateFOB
  gridPath: /Maps/_LuaM/POI/lpbravoLuaM.yml
  hideWarp: true
  addComponents:
  - type: IFF
    color: "#FF0040FF"
    flags: [HideLabel]
    readOnly: false
  - type: SyndicateFOB # For pinpointer
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true
  - type: RadarStealthField # LuaM: hidden from radars and the map farther than 1 km
    revealRange: 1000
    fieldRadius: 0

- type: gameMap
  id: LPBravo
  mapName: 'Прослушка «Браво»'
  mapPath: /Maps/_LuaM/POI/lpbravoLuaM.yml
  minPlayers: 0
  stations:
    LPBravo:
      gridComponents:
      - type: VesselInfo
        description: "Пост прослушивания, затерянный в пустоте. Чьи переговоры он слушает, лучше не спрашивать."
      stationProto: StandardFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Прослушка «Браво»'
        - type: StationJobs
          availableJobs: {}
        - type: StationDeadDropHintExempt
