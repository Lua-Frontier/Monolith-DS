- type: pointOfInterest
  id: LPBravo
  parent: BasePOI
  name: 'Прослушка «Браво»'
  minimumDistance: 15000
  maximumDistance: 17000
  spawnGroup: SyndicateFOB
  gridPath: /Maps/_LuaM/POI/lpbravoLuaM.yml
  hideWarp: true
  addComponents:
  - type: IFF
    color: "#FF0040FF"
    flags: [HideLabel]
    readOnly: false
  - type: SyndicateFOB # For pinpointer
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: LPBravo
  mapName: 'Listening Point Bravo'
  mapPath: /Maps/_LuaM/POI/lpbravoLuaM.yml
  minPlayers: 0
  stations:
    LPBravo:
      stationProto: StandardFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Listening Point Bravo'
        - type: StationJobs
          availableJobs: {}
        - type: StationDeadDropHintExempt
