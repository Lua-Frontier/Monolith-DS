- type: pointOfInterest
  id: Medical
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Медицинский Центр'
  minimumDistance: 1650
  maximumDistance: 2700
  spawnGroup: Required
  gridPath: /Maps/_LuaM/POI/MedicalLuaM.yml
  addComponents:
  - type: MapRadiusIndicator
    radius: 500
    color: "#00b7eb"
    fillAlpha: 0.15
    outlineAlpha: 0.35
  - type: IFF
    color: "#00b7eb"
  - type: Company
    companyName: MD
  - type: StationTransit
  - type: CyberpsychosisBlocker # no cyberpsychosis on the station

- type: gameMap
  id: Medical
  mapName: 'Медицинский Центр'
  mapPath: /Maps/_LuaM/POI/MedicalLuaM.yml
  minPlayers: 0
  stations:
    Medical:
      stationProto: RecordsFrontierOutpost
      gridComponents:
      - type: VesselInfo
        description: "Медицинский центр Колосса и база поисково-спасательных бригад. Здесь лечат всех, кто сумел долететь."
      - type: CyberpsychosisBlocker # no cyberpsychosis on the station
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Медицинский Центр'
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Markers/jobs.rsi
            state: medic
          stationSubtext: 'frontier-lobby-medical-subtext'
          stationDescription: 'frontier-lobby-medical-description'
          lobbySortOrder: 4
        - type: StationJobs
          availableJobs:
            DirectorOfCare: [ 1, 1 ]
            MdMedic: [ 5, 5 ]
          tags:
          - HeadOfPersonnel
          - HeadOfSecurity
        - type: StationDeadDrop
          maxDeadDrops: 1
