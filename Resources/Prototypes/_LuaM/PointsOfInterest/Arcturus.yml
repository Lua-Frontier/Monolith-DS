- type: pointOfInterest
  id: TSFMCOutpost
  parent: [BaseMobilePOI, BaseRepairablePOI]
  name: 'Крейсер Арктурус'
  minimumDistance: 4500
  maximumDistance: 5500
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueTSF, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce, MonoChimeraTsfPdv ]
  spawnGroup: Required
  gridPath: /Maps/_LuaM/POI/ArcturusPOI.yml
  addComponents:
  - type: MapRadiusIndicator
    radius: 500
    color: "#047abd"
    fillAlpha: 0.15
    outlineAlpha: 0.35
  - type: IFF
    color: "#047abd"
    flags: [HideLabel]
    readOnly: true
  - type: Company # TSF sees the cruiser through its hidden IFF
    companyName: TSF

- type: gameMap
  id: TSFMCOutpost
  mapName: 'Крейсер Арктурус'
  mapPath: /Maps/_LuaM/POI/ArcturusPOI.yml
  minPlayers: 0
  stations:
    TSFMCOutpost:
      stationProto: SecurityFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Крейсер Арктурус'
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Decoration/banner.rsi
            state: nfsd-banner
          stationSubtext: 'frontier-lobby-tsfmc-secondary-subtext'
          stationDescription: 'frontier-lobby-tsfmc-secondary-description'
          lobbySortOrder: 2
        - type: StationJobs
          availableJobs:
            Bailiff: [1, 1 ]
            SeniorOfficer: [ 0, 3 ]
            Brigmedic: [ 0, 1 ]
            Deputy: [ 4, 4 ]
            TsfEngineer: [ 1, 1 ]
            TsfBorg: [ 1, 1 ]
          tags:
          - HeadOfPersonnel
          - HeadOfSecurity
        - type: StationDeadDropHintExempt
        - type: StationDeadDropReporting
          messageSet: Nfsd
      gridComponents:
      - type: VesselInfo
        description: "Некогда главный аргумент ТСФ против Крейсера Юпитер. В том бою он лишился всего вооружения, но после ремонта и некой модификации системы электропитания вернулся в строй и снова служит Корпусу морской пехоты ТСФ в составе 113-й бригады."
