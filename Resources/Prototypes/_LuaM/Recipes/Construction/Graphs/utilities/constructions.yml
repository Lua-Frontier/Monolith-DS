# STORAGES
- type: constructionGraph
  id: CrateBlueSpace
  start: start
  graph:
  - node: start
    edges:
    - to: done
      steps:
      - material: Plasteel
        amount: 5
      - material: Cable
        amount: 2
        doAfter: 5
      - tag: CrateBluespaceElectronics
        name: crate-bluespace-electronics
        icon:
          sprite: _LuaM/Objects/Misc/module.rsi
          state: bluespace_electronics
  - node: done
    entity: CrateBlueSpace
    edges:
    - to: start
      steps:
      - tool: Screwing
        doAfter: 5
      conditions:
      - !type:StorageWelded
        welded: false
      - !type:Locked
        locked: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetPlasteel1
        amount: 5
      - !type:SpawnPrototype
        prototype: CableApcStack1
        amount: 2
      - !type:SpawnPrototype
        prototype: CrateBluespaceElectronics
        amount: 1
      - !type:EmptyAllContainers
      - !type:DeleteEntity

