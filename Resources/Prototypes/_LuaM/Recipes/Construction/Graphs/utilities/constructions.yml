# FANS
- type: constructionGraph
  id: AtmosDeviceFanDirectional
  start: start
  graph:
  - node: start
    edges:
    - to: AtmosDeviceFanDirectional
      steps:
      - material: Steel
        amount: 10
      - material: Cable
        amount: 5
        doAfter: 3
      - tag: FanElectronics
        name: construction-graph-tag-fan-electronics
        icon:
          sprite: Objects/Misc/module.rsi
          state: door_electronics
  - node: AtmosDeviceFanDirectional
    entity: AtmosDeviceFanDirectional
    edges:
    - to: start
      steps:
      - tool: Screwing
        doAfter: 5
      - tool: Welding
        doAfter: 15
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 10
      - !type:SpawnPrototype
        prototype: CableApcStack1
        amount: 5
      - !type:SpawnPrototype
        prototype: FanElectronics
        amount: 1
      - !type:DeleteEntity

