# Parent for shuttle rules whose grids should be cleaned up: the shuttle and every piece it breaks into go away
# once no player has been near (mono.cleanup.grid.distance) for ~10 minutes, whatever their IFF, value or power.
# Not used right now: the AI shuttle rules are ghost role antags and keep their wrecks like Asakim and Chimera.
- type: entity
  id: LuaMShuttleRuleCleanup
  abstract: true
  components:
  - type: RuleGridsCleanup
    cleanupAcceleration: 3 # mono.grid_cleanup_duration is 30 minutes, 3 times faster is 10
    ignoreIFF: true
    ignorePrice: true
    ignorePowered: true
