- type: entity
  id: OrganTajaranEyes
  parent: OrganHumanEyes
  name: tajaran eyes
  description: They reflect off the darkness.
  components:
  - type: Organ
    onAdd:
    - type: NightVision
      relayOverlay: true
      goggleEffect: true
      viewCircleRadius: 880
      viewCircleCount: 1
      viewCircleSpacing: 1
      action: ActionToggleNightVision
      phosphorColor: "#986033"
      lightingColor: "#ffffff52"
  - type: Sprite
    sprite: _LuaM/Body/Organs/tajaran-eyes.rsi
    layers:
    - state: eyeball-l
    - state: eyeball-r
