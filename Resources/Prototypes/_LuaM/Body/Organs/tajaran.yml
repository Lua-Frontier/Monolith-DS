- type: entity
  id: OrganTajaranEyes
  parent: OrganHumanEyes
  name: tajaran eyes
  description: They reflect off the darkness.
  components:
  - type: Organ
    onAdd:
    - type: NightVision
      relayOverlay: false
      goggleEffect: true
      viewCircleRadius: 1000
      viewCircleCount: 1
      viewCircleSpacing: 1
      action: ActionToggleNightVision
      phosphorColor: "#b4b4b4"
      lightingColor: "#ffffff52"
      amplification: 8
  - type: Sprite
    sprite: _LuaM/Body/Organs/tajaran-eyes.rsi
    layers:
    - state: eyeball-l
    - state: eyeball-r
