# Medium explosion

- type: entity
  parent: ExplosionEffectGrenade
  id: ExplosionEffectLuaMMedium
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    scale: 1.8, 1.8
  - type: ParticleEmitter
    effect: ExplosionFlashLuaMMedium

- type: entity
  id: ExplosionEffectLuaMMediumShockWave
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.6
  - type: ExplosionShockWave
    falloffPower: 28

- type: entity
  id: ExplosionEffectLuaMMediumEmbers
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 1.5
  - type: ParticleEmitter
    effect: ExplosionEmbersLuaMMedium

- type: entity
  id: ExplosionEffectLuaMMediumGlowingEmbers
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 3.2
  - type: ParticleEmitter
    effect: ExplosionGlowingEmbersLuaMMedium

# Large explosion

