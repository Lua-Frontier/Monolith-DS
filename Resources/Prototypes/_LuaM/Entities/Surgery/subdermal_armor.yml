- type: entity
  parent: SurgeryBase
  id: SurgeryRemoveSubdermalArmor
  name: Remove Subdermal Armor
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - SurgeryStepSawBones
    - SurgeryStepClampInternalBleeders
    - SurgeryStepRemoveOrgan
  - type: SurgeryPartCondition
    part: Torso
  - type: SurgeryOrganCondition
    organ:
    - type: SubdermalArmor

- type: entity
  parent: SurgeryBase
  id: SurgeryInsertSubdermalArmor
  name: Insert Subdermal Armor
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage
    steps:
    - SurgeryStepSawBones
    - SurgeryStepInsertOrgan
    - SurgeryStepSealOrganWound
  - type: SurgeryOrganSlotCondition
    organSlot: subdermal
  - type: SurgeryPartCondition
    part: Torso
  - type: SurgeryOrganCondition
    organ:
    - type: SubdermalArmor
    inverse: true
    reattaching: true
