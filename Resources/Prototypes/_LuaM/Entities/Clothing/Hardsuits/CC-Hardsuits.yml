- type: entity
  parent: ClothingOuterHardsuitBaseNFNfsd
  id: ClothingHeadHardsuitM92
  name: M92 colonia tacsuit
  description: A light, gilded tacsuit issued to commanding officers of TSF flagships. Fast and agile, with reinforced plating in vital areas, but it carries no shield.
  components:
  - type: Sprite
    sprite: _Lua/Clothing/OuterClothing/SDHardsuits/M92-outer.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Lua/Clothing/OuterClothing/SDHardsuits/M92-outer.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetHardsuitM92
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: FireProtection
    reduction: 0.2
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.65
        Radiation: 0.65
        Caustic: 0.15
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: StaminaDamageResistance
    coefficient: 0.70

- type: entity
  parent: [ ClothingOuterHardsuitBaseNoPlateholder, MonoEnergyShieldClothing ]
  id: ClothingHeadHardsuitM92x
  name: Colonia M92x tacsuit
  description: A gilded tacsuit for TSF flagship command staff. Trades conventional armor plating for environmental protection and a rechargeable hard-shield.
  components:
  - type: Sprite
    sprite: _Lua/Clothing/OuterClothing/SDHardsuits/M92x-outer.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Lua/Clothing/OuterClothing/SDHardsuits/M92x-outer.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.03
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.003
    coolingCoefficient: 0.003
  - type: HeldSpeedModifier
  - type: StaminaDamageResistance
  - type: ToggleableClothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetHardsuitM92x
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: ExplosionResistance
    damageCoefficient: 0.25
  - type: FireProtection
    reduction: 0.7
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.70
        Heat: 0.25
        Radiation: 0.2
        Caustic: 0.55
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.75
  - type: PersonalShield
    visuals:
      fillLevel: 0.2
      hexDensity: 6
      pixelGrid: 192
      color: "#08862e"
      scale: 2.3
    shield:
      maxCharge: 170
      regenRate: 4
      spinupTime: 1.0
      breakCooldown: 20
      powerDraw: 1.2
      blockModifier:
        coefficients:
          Piercing: 0.5
          Heat: 1.5
          Radiation: 2.5
          Shock: 2.5
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 5
  - type: UseDelay
    delay: 10
  - type: ExtendDescription
    descriptionList:
    - description: Alt-click or otherwise interact to toggle additional shielding.
      color: "#4f94ad"
      requireDetailRange: true
    - description: The M92-x shield is designed to inhibit the velocity of incoming conventional firearms. However, it struggles against anything involving high-energy particles, such as lasers.
      color: "#94768c"
      requireDetailRange: true

