# Big ammo boxes for the ammo variants, one per small variant box that a lathe can print.
# Capacity, shape and the big box sprite come from the big FMJ box of the caliber, the mark on top from the small variant box.

# AmmoBox9x19mmBigFMJ

- type: entity
  parent: AmmoBox9x19mmBigFMJ
  id: AmmoBox9x19mmBigPractice
  name: big ammunition box (9x19mm practice)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge9x19mmPractice
  - type: Sprite
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]
