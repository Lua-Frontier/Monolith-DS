# 71-round drum magazines of the PPSh.
- type: entity
  id: BaseMagazine762x25mmDrum
  name: drum magazine (7.62x25mm FMJ)
  parent: [BaseItem, RecyclableItemSteelTiny]
  abstract: true
  components:
  - type: Tag
    tags:
      - Magazine762x25mmDrum
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge762x25mmFMJ
    proto: Cartridge762x25mmFMJ
    capacity: 71
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/bullet_insert.ogg
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _LuaM/Objects/Weapons/Guns/Ammunition/Magazines/7.62x25mm/7.62x25mm_drum_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

- type: entity
  id: Magazine762x25mmDrumFMJ
  name: drum magazine (7.62x25mm FMJ)
  parent: BaseMagazine762x25mmDrum
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge762x25mmFMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

