# Big ammo boxes for the calibers that only had small ones. Three times the small box, like the other big boxes.

- type: entity
  parent: AmmoProvider12_gaugeShotgunShell
  id: AmmoBox12_gaugeBigBuckshot
  name: big shotgun shell box (12 gauge buckshot)
  suffix: Big
  components:
  - type: Item
    shape:
    - 0,0,2,1
  - type: BallisticAmmoProvider
    capacity: 96 # 3x standard box
    proto: ShellShotgun12_gaugeBuckshot
  - type: Sprite
    sprite: _LuaM/Objects/Weapons/Guns/Ammunition/Boxes/12_gauge.rsi
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]

