- type: entity
  abstract: true
  parent: [BaseItem, RecyclableItemCardboard]
  id: BaseAmmoBox762x25mm
  name: ammunition box (7.62x25mm FMJ)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge762x25mmFMJ
    proto: Cartridge762x25mmFMJ
    capacity: 80
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _LuaM/Objects/Weapons/Guns/Ammunition/Boxes/7.62x25mm.rsi
  - type: Tag
    tags:
    - Magazine762x25mmBox
  - type: Appearance
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg

- type: entity
  parent: BaseAmmoBox762x25mm
  id: AmmoBox762x25mmFMJ
  name: ammunition box (7.62x25mm FMJ)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge762x25mmFMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

