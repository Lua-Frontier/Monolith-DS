# Army laser pistol and carbine, sprites and sounds from Orion via Nebula.

- type: entity
  parent: WeaponLaserPistolNF
  id: WeaponMercLaserPistol
  name: army laser pistol
  suffix: Merc
  description: A standard issue army laser pistol. Reliable, compact and easy to service in the field.
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Weapons/Guns/Battery/EG-P.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-2
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    sprite: _LuaM/Objects/Weapons/Guns/Battery/EG-P.rsi
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: true
  - type: Gun
    soundGunshot:
      path: /Audio/_LuaM/Weapons/Guns/EG-P/shot.ogg
  - type: HitscanBatteryAmmoProvider
    proto: RedMediumLaser
    fireCost: 33.3
  - type: StaticPrice
    price: 200

- type: entity
  parent: WeaponLaserCarbine
  id: WeaponMercLaserCarbine
  name: army laser carbine
  suffix: Merc
  description: A standard issue army laser carbine. Thanks to the short barrel it has better maneuverability in narrow spaces.
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Weapons/Guns/Battery/EG-C/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-2
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    sprite: _LuaM/Objects/Weapons/Guns/Battery/EG-C/tiny.rsi
  - type: Clothing
    sprite: _LuaM/Objects/Weapons/Guns/Battery/EG-C/tiny.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: true
  - type: HitscanBatteryAmmoProvider
    proto: LuaMRedLaserMercCarbine
    fireCost: 30
  - type: StaticPrice
    price: 750

- type: entity
  parent: RedMediumLaser
  id: LuaMRedLaserCarbine
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 20

- type: entity
  parent: RedMediumLaser
  id: LuaMRedLaserMercCarbine
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 24

- type: entity
  parent: WeaponMercLaserPistol
  categories: [ HideSpawnMenu ]
  id: WeaponMercLaserPistolExpedition

- type: entity
  parent: WeaponMercLaserCarbine
  categories: [ HideSpawnMenu ]
  id: WeaponMercLaserCarbineExpedition
  components:
  - type: Gun
    burstCooldown: 0.5
    burstFireRate: 3
    shotsPerBurst: 3

- type: entity
  parent: WeaponCaseShort
  id: WeaponCaseShortMercLaserPistolExpedition
  suffix: Dungeon, Army Laser Pistol
  components:
  - type: StorageFill
    contents:
    - id: WeaponMercLaserPistolExpedition
      amount: 2

- type: entity
  parent: WeaponCaseLong
  id: WeaponCaseLongMercLaserCarbineExpedition
  suffix: Dungeon, Army Laser Carbine
  components:
  - type: StorageFill
    contents:
    - id: WeaponMercLaserCarbineExpedition
      amount: 1

- type: loadout
  id: MercenaryMercLaserPistolLoadout
  price: 3500
  storage:
    back:
    - WeaponMercLaserPistol

- type: loadout
  id: MercenaryMercLaserCarbineLoadout
  price: 10000
  storage:
    back:
    - WeaponMercLaserCarbine

- type: loadout
  id: FactionMercLaserPistolLoadout
  price: 0
  storage:
    back:
    - WeaponMercLaserPistol
