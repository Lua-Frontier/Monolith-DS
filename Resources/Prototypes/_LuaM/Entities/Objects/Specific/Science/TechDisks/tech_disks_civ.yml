- type: entity 
  parent: TechDiskBase
  id: TechDiskCombatSilicon
  name: combat silicon technology tech disk
  description: A disk capable of adding advanced combat silicon technology to a server's recipes.
  suffix: DO NOT MAP
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base"]
      color: "#2d6f8c"
    - state: label
    - state: protect
    - state: design
      shader: unshaded
  - type: TechnologyDisk
    recipes:
    - NaniteApplicatorSyndicate
    - ExperimentalPowerCellCombat

- type: entity
  parent: TechDiskBase
  id: TechDiskZookeeperTranslatorImplanter
  name: zookeeper translator implant tech disk
  description: A disk capable of adding zookeeper translator implant to a server's recipes.
  suffix: DO NOT MAP
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base"]
      color: "#d4d4d4"
    - state: label
    - state: protect
    - state: holo
      shader: unshaded
  - type: TechnologyDisk
