# Base
- type: entity
  parent: BaseItem
  id: ArmorPlateStorageT1
  name: armor‑plate storage box
  suffix: 4 plates
  description: A storage box for armor plates, holds 4 plates.
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Specific/StoragePlate.rsi
    state: icon
  - type: Item
    sprite: _LuaM/Objects/Specific/StoragePlate.rsi
    size: Normal
    shape:
    - 0,0,3,3
  - type: Matchbox # LuaM
  - type: ContainerContainer # LuaM
    containers:
      plate1: !type:ContainerSlot
      plate2: !type:ContainerSlot
      plate3: !type:ContainerSlot
      plate4: !type:ContainerSlot
  - type: ItemSlots # LuaM
    slots:
      plate1:
        name: armor-plate
        whitelist:
          components:
          - ArmorPlateItem
      plate2:
        name: armor-plate
        whitelist:
          components:
          - ArmorPlateItem 
      plate3:
        name: armor-plate
        whitelist:
          components:
          - ArmorPlateItem
      plate4:
        name: armor-plate
        whitelist:
          components:
          - ArmorPlateItem
