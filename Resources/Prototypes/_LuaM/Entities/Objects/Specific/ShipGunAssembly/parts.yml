- type: entity
  abstract: true
  parent: BaseItem
  id: LuaMShipGunPartBase
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Specific/ShipGunAssembly/parts.rsi
  - type: Item
    size: Normal
  - type: GuideHelp
    guides:
    - ColossusShipWeaponAssembly
    - ColossusCatalogueShipWeapons

- type: entity
  parent: LuaMShipGunPartBase
  id: LuaMShipGunChargerMk1
  name: Mk1 weapon charger
  description: Power storage and charging unit for light ship weapons. Installed while assembling a weapon on its frame.
  components:
  - type: Sprite
    state: charger_mk1
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
    mirrorClothingModifier: false
  - type: Item
    size: Ginormous
  - type: Tag
    tags:
    - LuaMShipGunChargerMk1

- type: entity
  parent: LuaMShipGunPartBase
