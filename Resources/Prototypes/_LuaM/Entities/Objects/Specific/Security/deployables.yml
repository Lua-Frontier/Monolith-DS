  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3
    sprite: _NF/Objects/Weapons/Guns/Turrets/magazinefed.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: MultiHandedItem
