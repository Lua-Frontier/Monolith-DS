# Mars
- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherVGMars
  name: VG Mars LPC [T2]
  description: A small card that contains the data for the procurement of a Mars-class corvette from the station's reserves.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_capital
    - state: screen
      color: "#8C191EFF"
    - state: screen1
      color: "#B42328FF"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 3600 # one hour, as the Keelback
    consoleType: Viper
    companyName: TheViperGroup
    vessels:
    - VGMars
  - type: StaticPrice
    vendPrice: 325000
