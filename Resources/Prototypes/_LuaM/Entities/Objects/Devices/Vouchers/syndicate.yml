# Random Syndicate voucher spawner
- type: entity
  id: ShipVoucherSyndicateRandom
  name: random Syndicate LPC spawner
  description: Spawns a random Syndicate ship voucher.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon
    - state: screen
      color: "#eb0023"
    - state: screen5
      color: "#eb0023"
      shader: unshaded
  - type: RandomSpawner
    offset: 0
    deleteSpawnerAfterSpawn: true
    prototypes:
    - ShipVoucherBeatle
    - ShipVoucherHunter
    - ShipVoucherHydra
    - ShipVoucherInfiltrator
    - ShipVoucherTalon
