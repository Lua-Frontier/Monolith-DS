# Beatle
- type: entity
  parent: BaseShipLPC
  id: ShipVoucherBeatle
  name: Syndicate Beatle LPC
  description: A small card that contains the data for the procurement of a Beatle-class medium vessel.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon
    - state: screen
      color: "#eb0023"
    - state: screen2
      color: "#eb0023"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Syndicate
    companyName: Syndicate
    vessels:
    - Beatle


