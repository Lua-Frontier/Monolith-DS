- type: entity
  id: AvaliTranslator
  parent: [ TranslatorPoweredBase ]
  name: avali translator
  description: Translates speech between Avali and Tau-Ceti Basic.
  components:
  - type: HandheldTranslator
    spoken:
    - TauCetiBasic
    - Avali
    understood:
    - TauCetiBasic
    - Avali
    requires:
    - TauCetiBasic
    - Avali

- type: entity
  id: SharkTranslator
  parent: [ TranslatorPoweredBase ]
  name: plafeim translator
  description: Translates speech between Plafeim and Tau-Ceti Basic.
