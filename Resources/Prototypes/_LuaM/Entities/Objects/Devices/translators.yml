- type: entity
  parent: BaseSubdermalImplant
  id: AvaliTranslatorImplant
  name: avali translator implant
  description: An implant giving the ability to understand and speak Avali.
  categories: [ HideSpawnMenu ]
  components:
  - type: TranslatorImplant
    understood:
    - Avali
    spoken:
    - Avali
    requires:
    - TauCetiBasic

