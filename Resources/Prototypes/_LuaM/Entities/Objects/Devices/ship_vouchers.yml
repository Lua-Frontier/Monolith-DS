- type: entity
  abstract: true
  parent: BaseShipVoucher
  id: BaseShipLPC
  name: ship LPC
  description: Contains the necessary data for a shipyard console to produce a certain design.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/newlpc.rsi
    state: icon
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 1800 # thirty minutes

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherRising
  name: TSF Rising LPC [T3]
  description: A small card that contains the data for the procurement of an Rising-class frigate from the flagship's reserves.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_capital
    - state: screen
      color: "#05ffff"
    - state: screen1
      color: "#05ffff"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 10800
    consoleType: Security
    companyName: TSF
    vessels:
    - TSFMCRising
  - type: StaticPrice
    vendPrice: 600000
