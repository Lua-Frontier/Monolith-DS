# LuaM: every implant that used to come in an implanter now comes in an autosurgeon.
# Generated from the old implanters, which were removed. Translators still use implanters.

- type: entity
  parent: [ BaseAutosurgeon, BaseFactionGearOtherFactionT2 ]
  id: AutosurgeonImplantEmp
  name: autosurgeon (EMP implant)
  description: Installs the EMP implant into whoever is buckled to it, or into whoever turns it on.
  components:
  - type: Sprite
    state: icon-syndie
  - type: AutoSurgeon
    implant: EmpImplant

- type: entity
  parent: [ BaseNFFlatpack, BaseFactionGearOtherFactionT2 ]
  id: AutosurgeonImplantEmpFlatpack
  name: autosurgeon (EMP implant) flatpack
  description: A flatpack used for constructing an autosurgeon.
  components:
  - type: Item
    size: Small
  - type: Flatpack
    entity: AutosurgeonImplantEmp
  - type: StaticPrice
    price: 35
  - type: Sprite
    layers:
    - state: medical_lathe

