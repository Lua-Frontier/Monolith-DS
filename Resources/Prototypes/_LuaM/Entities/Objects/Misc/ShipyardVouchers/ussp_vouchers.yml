- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherDefiant
  name: USSP Defiant LPC [T3]
  description: A small card that contains the data for the procurement of a Defiant-class cruiser.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_capital
    - state: screen
      color: "#b40505"
    - state: screen7
      color: "#b40505"
      shader: unshaded
  - type: Item
    heldPrefix: ussp
  - type: ShipyardVoucher
    tier: 3
    destroyOnEmpty: false
    cooldown: 5100
    consoleType: USSP
    companyName: USSP
    vessels:
    - defiant


