# Service implants: USSP and Viper Group R&D. No humanity cost.
# They put the dose straight into the stomach, like eating or drinking.

- type: entity
  parent: BaseSubdermalImplant
  id: BaseServiceInjectorImplant
  abstract: true
  components:
  - type: InjectorImplant
    injectOnCritical: false
    intoStomach: true
    rechargeTime: 180
    solution: {}

# Nutrients

- type: entity
  parent: BaseServiceInjectorImplant
  id: NutrientInjectorImplant
  name: nutrient injector implant
  description: Puts a dose of nutrients straight into the stomach on demand.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateNutrientInjectorImplant
  - type: InjectorImplant
    usedPopup: service-implant-nutrient-used
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 15

- type: entity
  id: ActionActivateNutrientInjectorImplant
  name: Inject Nutrients
  description: Puts a dose of nutrients into your stomach. Each charge recharges in 3 minutes.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    charges: 3
    checkCanInteract: false
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Consumable/Food/mre.rsi
      state: paste
    event: !type:UseInjectorImplantEvent

