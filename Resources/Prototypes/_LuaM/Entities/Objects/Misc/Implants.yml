- type: entity
  parent:
    - BaseSubdermalImplant
  id: MMCUplinkImplant
  name: uplink implant
  description: This implant lets the user access a hidden MMC uplink at will.
  categories: [ HideSpawnMenu ]
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusSurgery
    - ColossusServiceImplants
  # LuaM-end
  - type: SubdermalImplant
    implantAction: ActionOpenUplinkImplant
    whitelist:
      components:
      - Hands
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    name: store-preset-name-mmc-uplink
    categories:
    - UplinkMmcProtection
    - UplinkMmcMunitions
    - UplinkMmcGear
    - UplinkMmcTools
    - UplinkMmcFlatpacks
    - UplinkMmcEngineeringFlatpacks
    - UplinkMmcAtmosphericsFlatpacks
    - UplinkMmcCorporateSuppliesFlatpacks
    balance:
      MMCIndustrialCredit: -3500 # купил аплинк за 3 ляма? А ТЕПЕРЬ ПЛАТИ ЕЩЕ И 3500 ТК ДЛЯ АКТИВАЦИИ! *Злобный смех*
    currencyWhitelist:
    - MMCIndustrialCredit
  - type: Tag
    tags:
    - MMCUplink
