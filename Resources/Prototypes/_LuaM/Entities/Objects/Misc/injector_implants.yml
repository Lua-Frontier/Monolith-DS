- type: entity
  parent: BaseSubdermalImplant
  id: CombatMedipenImplant
  name: combat medipen implant
  description: Injects a combat medipen dose on demand and automatically when the owner goes critical.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateCombatMedipenImplant
  - type: CyberwareHumanity
    cost: 1
  - type: InjectorImplant
    solution:
      reagents:
      - ReagentId: Omnizine
        Quantity: 25
      - ReagentId: TranexamicAcid
        Quantity: 5

- type: entity
  parent: BaseSubdermalImplant
  id: StimulantImplant
  name: stimulant implant
  description: Injects a dose of stimulants on demand and automatically when the owner goes critical.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateStimulantImplant
  - type: CyberwareHumanity
    cost: 1
  - type: InjectorImplant
    solution:
      reagents:
      - ReagentId: Stimulants
        Quantity: 30

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonCombatMedipen
  name: autosurgeon (combat medipen implant)
  description: Installs an implant that injects a combat medipen dose on demand and automatically when the owner goes critical.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusSurgery
    - ColossusServiceImplants
  # LuaM-end
  - type: AutoSurgeon
    implant: CombatMedipenImplant

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonCombatMedipenFlatpack
  name: autosurgeon (combat medipen implant) flatpack
  description: A flatpack used for constructing an autosurgeon.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusSurgery
    - ColossusServiceImplants
  # LuaM-end
  - type: Flatpack
    entity: AutosurgeonCombatMedipen
  - type: StaticPrice
    price: 5000
  - type: Sprite
    layers:
    - state: medical_lathe

