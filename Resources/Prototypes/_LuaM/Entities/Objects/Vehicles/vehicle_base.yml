- type: entity
  id: LuaMVehicleBase
  abstract: true
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.VehicleVisuals.Damaged:
        damaged:
          True: { visible: true }
          False: { visible: false }
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Strap
    position: None
    size: 500
    buckleDoafterTime: 1
    unbuckleDistanceSquared: 0.09
    buckleSound:
      path: /Audio/_LuaM/Vehicles/vehicle_door_open.ogg
      params:
        volume: 2.5
    unbuckleSound: /Audio/_LuaM/Vehicles/vehicle_door_close.ogg
  - type: GridVehicleMover
    maxSpeed: 15
    maxReverseSpeed: 4
    acceleration: 6
    reverseAcceleration: 4
    deceleration: 10
    maxRotationSpeedDegrees: 120
    rotationAccelerationDegrees: 240
    rotationDecelerationDegrees: 300
    alignmentAssistDegrees: 8
    ramMinSpeed: 3
    ramStructureDamage: 12
    ramHullDamage: 2
    mobRamDamage: 2.5
    mobRamSpeedMultiplier: 0.9
    mobCollisionHullDamage: 4
    speedAtZeroIntegrity: 0.6
    driftMinSpeed: 9
    driftGripDegrees: 70
    driftRecoverDegrees: 240
    driftMaxDegrees: 50
    driftDrag: 10
  - type: VehicleOvercharge
    speedMultiplier: 1.3
    duration: 3
    sound: /Audio/_LuaM/Vehicles/overdrive_activate.ogg
  - type: VehicleSound
    hornSound: /Audio/_LuaM/Vehicles/sound_vehicles_humvee_horn.ogg
    collisionSound:
      collection: LuaMVehicleCrash
      params:
        volume: 4
    collisionSoundCooldown: 1
    mobCollisionSound:
      path: /Audio/Effects/hit_kick.ogg
      params:
        volume: 4
  - type: VehicleEngine
    startSound: /Audio/_LuaM/Vehicles/vehicle_start.ogg
    stopSound: /Audio/_LuaM/Vehicles/vehicle_turned_off.ogg
    idleSound: /Audio/_LuaM/Vehicles/vehicle_idle.ogg
    slowSound: /Audio/_LuaM/Vehicles/vehicle_slow.ogg
    mediumSound: /Audio/_LuaM/Vehicles/vehicle_med.ogg
    fastSound: /Audio/_LuaM/Vehicles/vehicle_fast.ogg
    skidStartSound: /Audio/_LuaM/Vehicles/vehicle_skid_1.ogg
    skidSound: /Audio/_LuaM/Vehicles/vehicle_skid_2.ogg
    startDelay: 1.3
    exitDelay: 2.3
  - type: VehicleSpotlight
    radius: 6
    energy: 2.5
  - type: PointLight
    enabled: false
    radius: 6
    energy: 2.5
    softness: 2
    lightMask: Cone
    autoRot: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: LuaMVehicleFrameHumvee
  - type: VehicleIntegrity
    maxIntegrity: 1000
  - type: SolutionContainerManager
    solutions:
      fuel:
        maxVol: 250
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 250
  - type: RefillableSolution
    solution: fuel
  - type: VehicleFuel
    consumptionPerMinute: 4
  - type: Repairable
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Explosive
    explosionType: Default
    totalIntensity: 60
    intensitySlope: 5
    maxIntensity: 10
  - type: StaticPrice
    price: 15000
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: Pullable
  - type: GravityAffected

- type: entity
  parent: LuaMVehicleBase
  id: LuaMHoverVehicleBase
  abstract: true
  components:
  - type: HoverVehicle
