- type: entity
  parent: LuaMVehicleBase
  id: LuaMVehicleTank
  name: FV150 Hobelar light tank
  description: A light cavalry tank with a fully traversable turret. The gunner aims the turret, the driver keeps it moving.
  components:
  - type: Sprite
    drawdepth: OverMobs
    sprite: _LuaM/Structures/Vehicles/Tank/tank.rsi
    layers:
    - map: [ base ]
      state: tank_base
    - map: [ damaged ]
      state: damaged_frame
      visible: false
    - map: [ wheels ]
      state: wheels_1
  - type: Icon
    sprite: _LuaM/Structures/Vehicles/Tank/icon.rsi
    state: icon
  - type: SpriteMovement
    movementLayers:
      wheels:
        state: wheels_0
    noMovementLayers:
      wheels:
        state: wheels_1
  - type: Fixtures
    fixtures:
      hull:
        shape:
          !type:PhysShapeAabb
          bounds: -0.8,-1.2,0.8,1.2
        density: 2500
        mask:
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: Strap
    position: None
    size: 500
    buckleDoafterTime: 1.5
    unbuckleDistanceSquared: 0.09
    buckleSound:
      path: /Audio/_LuaM/Vehicles/vehicle_door_open.ogg
      params:
        volume: 2.5
    unbuckleSound: /Audio/_LuaM/Vehicles/vehicle_door_close.ogg
  - type: StrapSlots
    offsets:
    - 0.2, -0.64
    - -0.26, -0.05
    - 0.26, 0.05
    - -0.03, 0.69
  - type: VehicleSeats
    blockAllHands: true
    seats:
    - Driver
    - Gunner
    - Passenger
    - Passenger
    driverActions:
    - ActionLuaMVehicleHorn
    - ActionLuaMVehicleSpotlight
    gunnerActions:
    - ActionLuaMVehicleSwitchShell
  - type: GridVehicleMover
    maxSpeed: 8
    weightClass: Heavy
    crushMinSpeedScale: 0.1
    crushSpeedRetention: 0.85
    crushHullDamageScale: 0
    maxReverseSpeed: 4
    acceleration: 2.5
    reverseAcceleration: 2
    deceleration: 8
    maxRotationSpeedDegrees: 70
    rotationAccelerationDegrees: 140
    rotationDecelerationDegrees: 220
    alignmentAssistDegrees: 8
    ramMinSpeed: 2.5
    ramStructureDamage: 30
    ramHullDamage: 0.5
    mobRamDamage: 4
    mobRamSpeedMultiplier: 0.97
    mobCollisionHullDamage: 1
    mobThrowMaxDistance: 3
    speedAtZeroIntegrity: 0.5
    driftMinSpeed: 0
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: LuaMVehicleFrameTank
  - type: VehicleSound
    hornSound: /Audio/_LuaM/Vehicles/Tank/HonkTruck.ogg
    collisionSound:
      collection: LuaMTankCrash
      params:
        volume: 0
    collisionSoundCooldown: 1
    mobCollisionSound:
      path: /Audio/Effects/hit_kick.ogg
      params:
        volume: 4
  - type: VehicleEngine
    startSound: /Audio/_LuaM/Vehicles/Tank/TankStart.ogg
    stopSound: /Audio/_LuaM/Vehicles/vehicle_turned_off.ogg
    idleSound: /Audio/_LuaM/Vehicles/Tank/TankIdle.ogg
    slowSound: /Audio/_LuaM/Vehicles/Tank/TankIdle.ogg
    mediumSound: /Audio/_LuaM/Vehicles/Tank/TankIdle.ogg
    fastSound: /Audio/_LuaM/Vehicles/Tank/TankIdle.ogg
    startDelay: 2.05
    exitDelay: 2.3
    volume: 0
  - type: VehicleIntegrity
    maxIntegrity: 2500
  - type: SolutionContainerManager
    solutions:
      fuel:
        maxVol: 500
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 500
  - type: RefillableSolution
    solution: fuel
  - type: VehicleFuel
    consumptionPerMinute: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Explosive
    explosionType: Default
    totalIntensity: 120
    intensitySlope: 5
    maxIntensity: 12
  - type: HardpointSlots
    family: Tank
    slots:
    - id: turret
      hardpointType: Turret
      startingItem: LuaMTankTurretArmed
      insertDelay: 3
    - id: wheel
      hardpointType: Wheel
      startingItem: LuaMTankTreads
      insertDelay: 2
  - type: ContainerContainer
    containers:
      turret: !type:ContainerSlot
      wheel: !type:ContainerSlot
  - type: VehicleTurret
    rotationSpeedDegrees: 95
    muzzleLength: 1.3
    sprite: _LuaM/Structures/Vehicles/Tank/tank.rsi
    pixelOffsets:
      South: -1, 0
      North: 0, 9
      East: 1, 8
      West: -1, 8
  - type: VehicleInterior
    sprite: _LuaM/Structures/Vehicles/Tank/interior.rsi
    state: tank
    seatOffsets:
      South:
      - 6.55, -20.38
      - -8.5, -1.7
      - 8.5, 1.7
      - -0.85, 22.1
      North:
      - -7.94, 29.87
      - 7.65, 9.86
      - -9.35, 6.46
      - 0, -13.94
      East:
      - 22.32, 13.96
      - 2.63, -0.68
      - -0.77, 16.32
      - -21.16, 6.97
      West:
      - -21.12, -1.31
      - -2.63, 14.62
      - 0.77, -2.38
      - 21.16, 6.97
  - type: StaticPrice
    price: 60000

- type: damageModifierSet
  id: LuaMVehicleFrameTank
  coefficients:
    Blunt: 0.5
    Slash: 0.4
    Piercing: 0.15
    Heat: 0.5
    Structural: 0.8

- type: entity
  parent: LuaMHumveeHardpointBase
  id: LuaMTankTreads
  name: FV150 treads
  description: A track set for the FV150 tank.
  components:
  - type: Sprite
    sprite: _LuaM/Structures/Vehicles/Tank/hardpoints.rsi
    state: treads
  - type: HardpointItem
    hardpointType: Wheel
    family: Tank

- type: entity
  parent: LuaMHumveeHardpointBase
  id: LuaMTankTurret
  name: FV150 turret
  description: A fully traversable tank turret. Fits a main gun.
  components:
  - type: Sprite
    sprite: _LuaM/Structures/Vehicles/Tank/hardpoints.rsi
    state: turret
  - type: HardpointItem
    hardpointType: Turret
    family: Tank
    visualState: tank_turret_0
  - type: HardpointSlots
    family: Tank
    slots:
    - id: turret-cannon
      hardpointType: Cannon
      insertDelay: 3
  - type: ContainerContainer
    containers:
      turret-cannon: !type:ContainerSlot

- type: entity
  parent: LuaMTankTurret
  id: LuaMTankTurretArmed
  suffix: Cannon
  components:
  - type: HardpointSlots
    family: Tank
    slots:
    - id: turret-cannon
      hardpointType: Cannon
      startingItem: LuaMTankCannon
      insertDelay: 3

- type: entity
  parent: LuaMHumveeHardpointBase
  id: LuaMTankCannon
  name: L26A2 tank cannon
  description: The FV150 main gun. Fires high-explosive, flechette and HEAT shells, one at a time, and has to be reloaded after every shot.
  components:
  - type: Sprite
    sprite: _LuaM/Structures/Vehicles/Tank/hardpoints.rsi
    state: heavy_autocannon
  - type: HardpointItem
    hardpointType: Cannon
    family: Tank
    visualState: heavy_autocannon_0
    muzzleOffsets:
      South: -2, -41
      North: 0, 39
      East: 40, 6
      West: -40, 6
  - type: Gun
    fireRate: 0.25
    projectileSpeed: 35
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_Mono/Weapons/Guns/Gunshots/autocannon.ogg
    cameraRecoilScalar: 0
    minAngle: 0
    maxAngle: 2
  - type: VehicleShellMagazine
    loadedSound: /Audio/Weapons/Guns/Cock/batrifle_cock.ogg
    switchSound: /Audio/Weapons/Guns/Cock/shotgun_open.ogg
    shells:
    - ammoType: TankShellHE
      proto: LuaMCartridgeTankHE
      name: luam-vehicle-shell-he
      capacity: 12
      startingCount: 6
    - ammoType: TankShellFlechette
      proto: LuaMCartridgeTankFlechette
      name: luam-vehicle-shell-flechette
      capacity: 12
      startingCount: 4
    - ammoType: TankShellHEAT
      proto: LuaMCartridgeTankHEAT
      name: luam-vehicle-shell-heat
      capacity: 12
      startingCount: 4

- type: entity
  abstract: true
  parent: BaseCartridge556x45mm
  id: LuaMCartridgeTankBase
  categories: [ HideSpawnMenu ]

- type: entity
  parent: LuaMCartridgeTankBase
  id: LuaMCartridgeTankHE
  name: shell (HE)
  components:
  - type: CartridgeAmmo
    proto: LuaMBulletTankHE
    deleteOnSpawn: true

- type: entity
  parent: LuaMCartridgeTankBase
  id: LuaMCartridgeTankFlechette
  name: shell (flechette)
  components:
  - type: CartridgeAmmo
    proto: LuaMBulletTankFlechette
    deleteOnSpawn: true

- type: entity
  parent: LuaMCartridgeTankBase
  id: LuaMCartridgeTankHEAT
  name: shell (HEAT)
  components:
  - type: CartridgeAmmo
    proto: LuaMBulletTankHEAT
    deleteOnSpawn: true

- type: entity
  parent: 90mmBulletHE
  id: LuaMBulletTankHE
  name: HE shell
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 50
        Structural: 40
  - type: Explosive
    explosionType: Default
    totalIntensity: 90
    intensitySlope: 4
    maxIntensity: 6
    maxTileBreak: 1
    tileBreakScale: 3

- type: entity
  parent: 90mmBulletBase
  id: LuaMBulletTankFlechette
  name: flechette shell
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 60
        Slash: 50
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/shells.rsi
    layers:
    - state: 90mmFLAK
  - type: PointLight
    color: orange
  - type: ProjectileGrenade
    fillPrototype: LuaMShrapnelTankFlechette
    capacity: 42
    minVelocity: 6
    maxVelocity: 8
    randomAngle: true
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container

- type: entity
  parent: Shrapnel90mmFlak
  id: LuaMShrapnelTankFlechette
  name: flechette
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 12
        Slash: 8
    armorPenetration: 0
    penetrationThreshold: 120
    penetrateMobs: true
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: TimedDespawn
    lifetime: 0.5

- type: entity
  parent: 90mmBulletBase
  id: LuaMBulletTankHEAT
  name: HEAT shell
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 360
        Blunt: 90
        Structural: 2100
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/shells.rsi
    layers:
    - state: 90mmAP
  - type: PointLight
    color: orange
  - type: ProjectileGrenade
    fillPrototype: LuaMPelletTankHEAT
    capacity: 10
    minVelocity: 18
    maxVelocity: 24
    coneDegrees: 40
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container

- type: entity
  parent: PelletClusterLethal
  id: LuaMPelletTankHEAT
  name: HEAT fragment
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    deleteOnCollide: true
    damage:
      types:
        Piercing: 54
  - type: TimedDespawn
    lifetime: 0.2

- type: entity
  parent: LuaMHumveeAmmoBoxBase
  id: LuaMTankAmmoBoxHE
  name: HE tank shell crate
  description: High-explosive shells for the FV150 cannon. Use it on the tank to load.
  components:
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/magazines.rsi
    state: 90mmHE
  - type: VehicleAmmoBox
    ammoType: TankShellHE
    amount: 6
    loadSound: /Audio/Weapons/Guns/MagIn/rifle_load.ogg

- type: entity
  parent: LuaMHumveeAmmoBoxBase
  id: LuaMTankAmmoBoxFlechette
  name: flechette tank shell crate
  description: Flechette shells for the FV150 cannon. Use it on the tank to load.
  components:
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/magazines.rsi
    state: 90mmFLAK
  - type: VehicleAmmoBox
    ammoType: TankShellFlechette
    amount: 6
    loadSound: /Audio/Weapons/Guns/MagIn/rifle_load.ogg

- type: entity
  parent: LuaMHumveeAmmoBoxBase
  id: LuaMTankAmmoBoxHEAT
  name: HEAT tank shell crate
  description: HEAT shells for the FV150 cannon. Use it on the tank to load.
  components:
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/magazines.rsi
    state: 90mmAP
  - type: VehicleAmmoBox
    ammoType: TankShellHEAT
    amount: 6
    loadSound: /Audio/Weapons/Guns/MagIn/rifle_load.ogg

- type: entity
  id: ActionLuaMVehicleSwitchShell
  name: Switch shell
  description: Load the next shell type into the cannon. Takes a full reload.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    icon: { sprite: _Mono/Objects/SpaceArtillery/shells.rsi, state: 90mmHE }
    event: !type:VehicleSwitchShellActionEvent

- type: soundCollection
  id: LuaMTankCrash
  files:
  - /Audio/Effects/metal_slam1.ogg
  - /Audio/Effects/metal_slam3.ogg
  - /Audio/Effects/metal_slam5.ogg
