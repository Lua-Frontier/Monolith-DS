- type: entity
  parent: LuaMVehicleHumveeBase
  id: LuaMVehicleHumveeARC
  name: humvee (ARC)
  description: A humvee configured as an armored reconnaissance carrier. It has to be deployed to use its cannon.
  components:
  - type: VehicleSeats
    seats:
    - Driver
    - Passenger
    - Passenger
    - Passenger
    - Gunner
    driverActions:
    - ActionLuaMVehicleHorn
    - ActionLuaMVehicleOvercharge
    - ActionLuaMVehicleSpotlight
    - ActionLuaMVehicleDeploy
    gunnerActions:
    - ActionLuaMVehicleSwitchWeapon
  - type: HardpointSlots
    family: Humvee
    slots:
    - id: turret
      hardpointType: Turret
      startingItem: LuaMHumveeARCTurret
      insertDelay: 2
    - id: roof
      hardpointType: RoofAttachment
      visualLayer: support
      insertDelay: 1.5
    - id: front
      hardpointType: FrontAttachment
      visualLayer: support-2
      insertDelay: 1.5
    - id: wheel
      hardpointType: Wheel
      startingItem: LuaMHumveeWheel
      insertDelay: 1.5
  - type: VehicleTurret
    rotationSpeedDegrees: 180
    fireGraceDegrees: 20
    requiresDeployed: true
    pixelOffsets:
      South: 0, 11
      North: 0, 3.5
      East: -4.5, 13
      West: 5.5, 13
  - type: VehicleDeployable
    deployTime: 5
    undeployTime: 5
  - type: VehicleAutoTurret
    range: 10
    cooldown: 0.2
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: VehicleIntegrity
    maxIntegrity: 800

- type: entity
  id: LuaMVehicleInteriorVisual
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    drawdepth: BelowMobs
    layers:
    - sprite: _LuaM/Structures/Vehicles/Humvee/interior.rsi
      state: humvee

- type: entity
  id: LuaMVehicleTurretVisual
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    drawdepth: Doors
    sprite: _LuaM/Structures/Vehicles/Humvee/humvee.rsi
    layers:
    - state: humveeturret_0
      visible: false
    - state: humveecannon_0
      visible: false

- type: soundCollection
  id: LuaMVehicleCrash
  files:
  - /Audio/_LuaM/Vehicles/vehicle_crash_1.ogg
  - /Audio/_LuaM/Vehicles/vehicle_crash_2.ogg

- type: damageModifierSet
  id: LuaMVehicleFrameHumvee
  coefficients:
    Blunt: 0.8
    Slash: 0.8
    Piercing: 0.35
    Heat: 0.8
    Structural: 1
