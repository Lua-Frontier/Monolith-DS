# Ported from Goob-Station (_EinsteinEngines/NPCs/carp.yml, PR #5275).

- type: entity
  name: space goldfish
  parent: BaseMobCarp
  id: MobCarpGoldfish
  description: A domesticated variety of space carp, much smaller but no less aggressive.
  components:
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-space-goldfish-name
    description: ghost-role-information-space-goldfish-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
  - type: GhostTakeoverAvailable
  - type: Tag
    tags:
    - VimPilot
    - Carp
    - CannotSuicide
  - type: Sprite
    drawdepth: Mobs
    sprite: _LuaM/Mobs/Aliens/Carps/goldfish.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: mouth
      shader: unshaded
    - map: [ "neck" ]
      state: equipped-NECK
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: mouth
      Critical:
        Base: critical
        BaseUnshaded: critical_mouth
      Dead:
        Base: dead
        BaseUnshaded: dead_mouth
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        alive: Rainbow
      enum.DamageStateVisualLayers.BaseUnshaded:
        mouth: ""
      neck:
        equipped-NECK: Rainbow
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Mouse_burning
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 1
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Item
    size: Tiny
  - type: CanEscapeInventory
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Critical
      50: Dead
  - type: Butcherable
    spawned:
    - id: FoodMeatFish
      amount: 1
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 100
      behaviors:
      - !type:GibBehavior
        gibContents: Skip
        recursive: false
  - type: MovementSpeedModifier
    baseSprintSpeed: 5
  - type: NpcFactionMember
    factions:
    - Mouse
  - type: Food
  - type: BadFood
  - type: FlavorProfile
    flavors:
    - fishy
  - type: Thirst
    startingThirst: 25
    thresholds:
      OverHydrated: 35
      Okay: 25
      Thirsty: 15
      Parched: 10
      Dead: 0
    baseDecayRate: 0.04
  - type: Hunger
    thresholds:
      Overfed: 35
      Okay: 25
      Peckish: 15
      Starving: 10
      Dead: 0
    baseDecayRate: 0.04
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 3
        - ReagentId: CarpoToxin
          Quantity: 3
  - type: Clothing
    quickEquip: false
    clothingVisuals:
      neck:
      - map: [ "neck" ]
        state: equipped-NECK
      - state: mouth-equipped-NECK
        shader: unshaded
    slots:
    - NECK
