    prototype: Avali
    requiredLegs: 2
  - type: Speech
    speechSounds: Avali
    allowedEmotes: ['Chirp', 'Trill', 'Scree', 'Call', 'Squawk', 'Warble', 'Wurble', 'Bagawk']
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - Avali
    understands:
    - TauCetiBasic
    - Avali
  - type: Sprite
    scale: 0.8, 0.8
