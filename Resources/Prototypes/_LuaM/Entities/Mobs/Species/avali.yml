- type: entity
  save: false
  name: Urist McAvali
  parent: BaseMobSpeciesOrganic
  id: BaseMobAvali
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Avali
    hideLayersOnEquip:
    - Hair
    - Head
    - Snout
    - HeadTop
    - HeadSide
  - type: Hunger
  - type: Thirst
  - type: Carriable
  - type: Bloodstream
    bloodReagent: AmmoniaBlood
  - type: Temperature
    coldDamageThreshold: 195.4
    heatDamageThreshold: 320.15
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 3
  - type: MovementSpeedModifier
    weightlessAcceleration: 2.5
