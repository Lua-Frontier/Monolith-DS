- type: entity
  id: PlastitaniumWindowDirectional
  parent: WindowDirectionalRCDResistant
  name: directional plastitanium window
  description: Don't smudge up the glass down there.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    sprite: _LuaM/Structures/Windows/directional_plastitanium.rsi
    state: plastitanium_window
  - type: Icon
    sprite: _LuaM/Structures/Windows/directional_plastitanium.rsi
    state: plastitanium_window
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.25"
        density: 3000
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: RGlass
  - type: Construction
    graph: PlastitaniumWindowDirectional
    node: plastitaniumWindowDirectional
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 8
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 1
          PartRodMetal:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Repairable
    qualities:
    - Welding
    - Applicating
    fuelCost: 10
    doAfterDelay: 2
  - type: DeltaPressure
    minPressure: 37500
    minPressureDelta: 25000
    scalingType: Threshold
  - type: StaticPrice
    price: 610
  - type: ShipRepairable
    repairTime: 6
    repairCost: 6
