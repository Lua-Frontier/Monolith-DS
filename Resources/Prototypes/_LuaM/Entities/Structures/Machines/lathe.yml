# Base abstract
- type: entity
  id: BaseLatheBeakerSlot
  abstract: true
  components:
  - type: ItemSlots
    slots:
      beaker_slot:
        name: lathe-component-output-slot-beaker-name
        whitelist:
          components:
          - DrainableSolution
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      beaker_slot: !type:ContainerSlot
  - type: Lathe
    reagentOutputSlotId: beaker_slot

# PDV
- type: entity
  id: PDVLathe
  parent: [BaseLatheLube, BaseLatheBeakerSlot]
  name: PDV TechFab
  description: Capable of manufacturing equipment to PDV design specifications.
  components:
  # LuaM-start: contextual equipment guide.
  - type: GuideHelp
    guides:
    - IndustryFabricators
  # LuaM-end
  - type: Sprite
    sprite: _Mono/Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: techfab-rogue
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: PDVLatheMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/circuitprinter.ogg
    idleState: icon
    runningState: icon
    staticPacks:
    - NFMercenaryTechfabDeprecatedStatic
    - StaticGrenades
    - MonoAttachmentsStatic
    - PDVLatheStatic
    # Ammo static
    - RoundstartShipgunAmmo
    - StaticAmmoRecipePack
    - MonoRestraintsStatic
    dynamicPacks:
    - MonoRogueWeaponsDynamicMelee
    - MonoRogueWeaponsDynamicRanged
    - MonoRogueVouchersDynamic
    - MonoRogueMiscDynamic
    - MonoRogueGearDynamic
    - MonoRogueGearProDynamic
    - TechDiskRecipes
    - NFMercenaryTechfabDeprecated
    - SecurityEquipment
    - SmartGun
    - ResearchedExplosives
    - ArmorBasic
    - ArmorAdvanced
    - PunkGear
    - BluespaceAirTanks
    - GlassesContractor
    # Ammo dynamic
    - UniversalRailgunAmmo
    - UniversalMissileAmmo
    - UniversalShellAmmo
    - UniversalOrdinance
    - DynamicAmmoRecipePack
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: RequireProjectileTarget
  - type: OreSiloClient
  - type: CompanyAccessReader
    requiredCompanies:
    - PDV
    - PDVHighComm
