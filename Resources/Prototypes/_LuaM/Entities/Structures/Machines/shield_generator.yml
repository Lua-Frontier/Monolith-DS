- type: entity
  id: ShieldGeneratorSmallCicads
  parent: ShieldGeneratorBase
  name: CIC-150 "Nebula" Shield Generator
  description: The Nebula. Advanced shielding, with a long recharge time, with very high durability.
  suffix: Cicads
  components:
  - type: ShipShieldEmitter
    damageLimit: 75000 # Mono
    healPerSecond: 500 # Mono
    damageExp: 1.05 # Mono
    baseDraw: 20000
    maxDraw: 70000
    unpoweredBonus: 3 # Mono
    damageOverloadTimePunishment: 80
    shieldColor: "#0038a8"
    collisionResistanceMultiplier: 0.5
  - type: Sprite
    sprite: _LuaM/Structures/Machines/shield_cicads.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#fafdff"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
          - 194 # oxygen
          - 0 # nitrogen
          - 0 # carbon dioxide
          - 6 # plasma
          temperature: 752.48
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Explosive
    explosionType: Default
    maxIntensity: 4000
    intensitySlope: 4
    totalIntensity: 300
  - type: ApcPowerReceiver
    powerLoad: 20000
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#3e9efe"
  - type: Machine
    board: MachineShieldCIC150Circuitboard
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: PirateBountyItem
    id: ShipShield
  - type: ShipRepairable
    repairTime: 20
    repairCost: 125
