# 3 tiles wide
- type: entity
  id: BigGlassAirlockBase
  parent: AirlockGlass
  abstract: true
  name: big glass airlock
  description: It looks like an ordinary airlock... but very wide. It opens, it closes, and it might crush you.
  suffix: 3 tiles
  components:
  - type: Transform
    noRot: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-0.49,1.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - GlassAirlockLayer
  - type: Sprite
    snapCardinals: false
    offset: 0,0

- type: entity
  id: BigAirlockGlass
  parent: [BigGlassAirlockBase, AirlockGlass]
  name: big glass airlock
  components:
  - type: Sprite
    sprite: _LuaM/Structures/Doors/Airlocks/Glass/big_glass_lua.rsi
  - type: Construction
    graph: LuaMWideAirlock
    node: bigAirlock

- type: entity
  id: BigMedicalAirlockGlass
  parent: [BigGlassAirlockBase, AirlockGlass]
  name: big glass medical airlock
  components:
  - type: Sprite
    sprite: _LuaM/Structures/Doors/Airlocks/Glass/big_medical_glass_lua.rsi
  - type: Construction
    graph: LuaMWideAirlock
    node: bigMedicalAirlock

- type: entity
  id: BigExternalAirlockGlass
  parent: [BigGlassAirlockBase, AirlockExternalGlass]
  name: big glass external airlock
  components:
  - type: Sprite
    sprite: _LuaM/Structures/Doors/Airlocks/Glass/big_external_glass_lua.rsi
  - type: Construction
    graph: LuaMWideAirlock
    node: bigExternalAirlock

