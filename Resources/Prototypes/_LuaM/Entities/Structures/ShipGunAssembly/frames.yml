- type: entity
  abstract: true
  id: LuaMShipGunFrameBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: OverMobs
    state: icon
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 400
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    delay: 5
  - type: Pullable
  - type: Rotatable
    rotateWhilePulling: false
    rotateWhileAnchored: false
    increment: 90
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: GuideHelp
    guides:
    - ColossusShipWeaponAssembly
    - ColossusCatalogueShipWeapons

- type: entity
  parent: LuaMShipGunFrameBase
  id: LuaMShipGunFrameLightBallistic
  name: light ballistic mount
  description: "Base of a ship weapon. Anchor it, then insert one of the fitting parts: L85 barrel x2, Adder barrel x2, RAC-30 barrel x3, AC-35 barrel x2, GS-002 flare tube x2."
  components:
  - type: Sprite
    sprite: _LuaM/Structures/ShipGunAssembly/frame_light_ballistic.rsi
  - type: Construction
    graph: LuaMShipGunFrameLightBallistic
    node: frame
    deconstructionTarget: null
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
    mirrorClothingModifier: false

