- type: tile
  id: FloorMechanicalPanel
  name: tiles-mechanical-floor-panel
  sprite: /Textures/_LuaM/Tiles/mechanical_panel.png
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepHull
  itemDrop: FloorTileItemMechanicalPanel
  heatCapacity: 10000

- type: entity
  name: mechanical floor tile
  parent: FloorTileItemBase
  id: FloorTileItemMechanicalPanel
  components:
  - type: Sprite
    sprite: _LuaM/Objects/Tiles/mechanical_tile.rsi
    state: mechanical-panel
  - type: Item
    heldPrefix: dark
  - type: FloorTile
    outputs:
    - Plating
    - FloorMechanicalPanel
  - type: Stack
    stackType: FloorTileMechanicalPanel

- type: stack
  id: FloorTileMechanicalPanel
  name: stack-mechanical-panel-tile
  spawn: FloorTileItemMechanicalPanel
  maxCount: 30

