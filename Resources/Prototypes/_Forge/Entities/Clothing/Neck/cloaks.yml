- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakTTIParamedicAlt
  name: TTI Paramedic's Cape
  description: A cozy cloak for conducting rescue operations. It definitely won’t give away your location with a bunch of strobe lights.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Corvax/Forge/Clothing/Neck/Cloaks/paramed-alt.rsi
    layers:
    - state: icon-off
    - state: icon-on
      color: "#a9b6bd"
      shader: unshaded
  - type: Clothing
    sprite: _Corvax/Forge/Clothing/Neck/Cloaks/paramed-alt.rsi
    clothingVisuals:
      neck:
      - state: equipped-NECK-off
      - state: equipped-NECK-on
        color: "#a9b6bd"
        shader: unshaded
