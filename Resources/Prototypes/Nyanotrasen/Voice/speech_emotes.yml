# vocal emotes
- type: emote
  id: Hiss
  category: Vocal
  name: chat-emote-name-hiss # LuaM: Hiss > chat-emote-name-hiss
  icon: _LuaM/Interface/Emotes/hiss.png # LuaM: Interface/Actions/scream.png > hiss.png
  available: false
  whitelist:
    components:
    - Vocal
  blacklist:
    components:
    - BorgChassis
  chatMessages: [chat-emote-msg-felinid-hiss] # LuaM: hisses. > chat-emote-msg-felinid-hiss
  chatTriggers:
    - hiss
    - hisses
    - hiss.
    - hisses.
    - hisses!
    - hissing
    - hissed
    - hissing.
    - hissed.

