- type: entity
  id: MonoAISTCShuttleSpawnerSchedulerSlow
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: DamagedAIShipsTable
    minimumTimeUntilFirstEvent: 3600 # 1 hour
    minMaxEventTiming:
      min: 3600 # 60 minutes between events # LuaM: 8100 > 3600
      max: 3600 # 60 minutes between events # LuaM: 10800 > 3600

- type: entity
  id: MonoAISTCShuttleSpawnerSchedulerTier2Slow
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: DamagedAIShipsTableT2
    minimumTimeUntilFirstEvent: 10800 # 3 hours # LuaM: 14400 > 10800
    minMaxEventTiming:
      min: 5400 # 90 minutes between events
      max: 5400 # 90 minutes between events

- type: entity
  id: MonoAsakimSTCShuttleSpawnerSchedulerSlow
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: AsakimShipsTable
    minimumTimeUntilFirstEvent: 5400 # 1 hour 30 minutes # LuaM: 7200 > 5400
    minMaxEventTiming:
      min: 5400 # 90 minutes between events
      max: 10800 # 180 minutes between events

- type: entity
  id: MonoChimeraSTCShuttleSpawnerSchedulerSlow
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: ChimeraShipsTableT1
    minimumTimeUntilFirstEvent: 6300 # 1 hour 45 minutes # LuaM: 10800 > 6300
    minMaxEventTiming: # LuaM: 3 chimeras per shift: 1:45, 4:15 and 6:45
      min: 9000 # 2.5 hours between events # LuaM: 5400 > 9000
      max: 9000 # 2.5 hours between events # LuaM: 5400 > 9000
