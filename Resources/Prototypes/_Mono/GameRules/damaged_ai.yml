- type: entityTable
  id: DamagedAIShipsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - id: UnknownShuttleZenith
      - id: UnknownShuttleWyrm
      - id: UnknownShuttleNebula

- type: entityTable
  id: DamagedAIShipsTableT2
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: UnknownShuttleZenithE
    - id: UnknownShuttleRazorN
    - id: UnknownShuttleWyvern
    - id: UnknownShuttleZenith
    - id: UnknownShuttleWyrm
    - id: UnknownShuttleNebula

- type: entity
  parent: BaseRandomShuttleRule
  id: UnknownShuttleZenith
  components:
  - type: StationEvent
    startAnnouncement: station-event-ai-shuttle-detected
    startAudio:
      path: /Audio/Misc/notice1.ogg
    weight: 2
    maxOccurrences: 4
  - type: GameRule
    minPlayers: 32
  - type: LoadMapRule
    gridPath: /Maps/_LuaM/ShuttleEvent/ZenithLuaM.yml # LuaM: /Maps/_Mono/ShuttleEvent/zenith.yml > /Maps/_LuaM/ShuttleEvent/ZenithLuaM.yml

- type: entity
  parent: BaseRandomShuttleRule
  id: UnknownShuttleZenithE
  components:
  - type: StationEvent
    startAnnouncement: station-event-ai-shuttle-detected
    startAudio:
      path: /Audio/Misc/notice1.ogg
    weight: 3
    maxOccurrences: 2
  - type: GameRule
    minPlayers: 32
  - type: LoadMapRule
    gridPath: /Maps/_LuaM/ShuttleEvent/Zenith_ELuaM.yml # LuaM: /Maps/_Mono/ShuttleEvent/zenith_e.yml > /Maps/_LuaM/ShuttleEvent/Zenith_ELuaM.yml

- type: entity
  parent: BaseRandomShuttleRule
  id: UnknownShuttleNebula
  components:
  - type: StationEvent
    startAnnouncement: station-event-ai-shuttle-detected
    startAudio:
      path: /Audio/Misc/notice1.ogg
    weight: 2
    maxOccurrences: 4
  - type: GameRule
    minPlayers: 32
  - type: LoadMapRule
    gridPath: /Maps/_LuaM/ShuttleEvent/NebulaLuaM.yml # LuaM: /Maps/_Mono/ShuttleEvent/nebula.yml > /Maps/_LuaM/ShuttleEvent/NebulaLuaM.yml

- type: entity
  parent: BaseRandomShuttleRule
  id: UnknownShuttleWyrm
  components:
  - type: StationEvent
    startAnnouncement: station-event-ai-shuttle-detected
    startAudio:
      path: /Audio/Misc/notice1.ogg
    weight: 3
    maxOccurrences: 6
  - type: GameRule
    minPlayers: 15
  - type: LoadMapRule
    gridPath: /Maps/_LuaM/ShuttleEvent/WyrmLuaM.yml # LuaM: /Maps/_Mono/ShuttleEvent/wyrm.yml > /Maps/_LuaM/ShuttleEvent/WyrmLuaM.yml

- type: entity
  parent: BaseRandomShuttleRule
  id: UnknownShuttleRazorN
  components:
  - type: StationEvent
    startAnnouncement: station-event-ai-razor-detected # LuaM: station-event-ai-shuttle-detected > station-event-ai-razor-detected
    startAudio:
      path: /Audio/Misc/delta_alt.ogg # LuaM: /Audio/Misc/notice1.ogg > /Audio/Misc/delta_alt.ogg
    weight: 2 # rare but not too rare since it's in the T2 spawner
    maxOccurrences: 1 # LuaM: 2 > 1
  - type: GameRule
    minPlayers: 40 # LuaM: 15 > 40
  - type: LoadMapRule
    gridPath: /Maps/_LuaM/ShuttleEvent/razorn.yml # LuaM: /Maps/_Mono/ShuttleEvent/razorn.yml > /Maps/_LuaM/ShuttleEvent/razorn.yml

- type: entity
  parent: BaseRandomShuttleRule
  id: UnknownShuttleWyvern
  components:
  - type: StationEvent
    startAnnouncement: station-event-ai-capital-detected
    startAudio:
      path: /Audio/Misc/delta_alt.ogg
    weight: 1.5
    maxOccurrences: 1
  - type: GameRule
    minPlayers: 40 # LuaM: 60 > 40
  - type: LoadMapRule
    gridPath: /Maps/_LuaM/ShuttleEvent/WyvernLuaM.yml # LuaM: /Maps/_Mono/ShuttleEvent/Wyvern.yml > /Maps/_LuaM/ShuttleEvent/WyvernLuaM.yml
