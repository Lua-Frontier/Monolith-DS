- type: pointOfInterest
  id: USSPCamelot
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Станция «Камелот»' # LuaM: 'Camelot Station' > 'Станция «Камелот»'
  minimumDistance: 10650
  maximumDistance: 12400
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueUSSP, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce, MonoChimeraTsfPdv ] # LuaM: MonoChimeraTsf/MonoChimeraPdv > MonoChimeraTsfPdv
  spawnGroup: Required
  gridPath: /Maps/_LuaM/POI/camelotLuaM.yml # LuaM: /Maps/_Mono/POI/camelot.yml > /Maps/_LuaM/POI/camelotLuaM.yml
  addComponents:
  - type: MapRadiusIndicator # LuaM: faction zone on the shuttle map
    radius: 500
    color: "#B01340"
    outlineColor: "#8C191E"
    fillAlpha: 0.15
    outlineAlpha: 0.35
  - type: IFF
    color: "#ccaa55"
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # Dead zone
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3

- type: gameMap
  id: USSPCamelot
  mapName: 'Станция «Камелот»' # LuaM: 'Freeport Camelot' > 'Станция «Камелот»'
  mapPath: /Maps/_LuaM/POI/camelotLuaM.yml # LuaM: /Maps/_Mono/POI/camelot.yml > /Maps/_LuaM/POI/camelotLuaM.yml
  minPlayers: 0
  stations:
    USSPCamelot:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
        - type: VesselMusic
          ambientMusicPrototype: CamelotMusic
        - type: VesselInfo
          description: "Ветхая станция, циклами собиравшаяся из того, что было под рукой. Стала опорной базой экспедиционного контингента СССП, отрезанного от Союза в секторе Колосс. Здесь же базируется ЧВК «Вайпер»." # LuaM: "A rickety old station that has been cobbled together over many many cycles..." > translated
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Станция «Камелот»' # LuaM: 'Freeport Camelot' > 'Станция «Камелот»'
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Storage/Crates/secure_ammo.rsi
            state: icon
          stationSubtext: 'frontier-lobby-camelot-subtext'
          stationDescription: 'frontier-lobby-camelot-description'
          lobbySortOrder: 4
        - type: StationJobs
          availableJobs:
            USSPCommissar: [1, 1]
            USSPSergeant: [3, 3] # LuaM: 4 > 3
            USSPRifleman: [5, 5] # LuaM: -1 > 5
            VGCommander: [1, 1]
            VGLieutenant: [2, 2]
            VGInfanteer: [5, 5] # LuaM: -1 > 5
#            Contractor: [-1, -1] # Commented by LuaM
            #Pilot: [0, -1]
            #Mercenary: [0, -1]
          tags:
          - USSPCommand
        - type: StationCargoBountyDatabase
          availableBounties:
          - USSPBountyArtifact
          - USSPBountyBread
          - USSPBountySoup
          - USSPBountyPizza
          - USSPBountyVodka
          - USSPBountyCivilianMech
          - USSPBountyPotato
          - USSPBountyBiomass
          - USSPBountyMilitaryMech
          - USSPKevlarVest
          - USSPVT7
          - USSPBountyLaserGun
        - type: StationDeadDrop
          maxDeadDrops: 2 # Fewer here, players start here.
