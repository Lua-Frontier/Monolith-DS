# Notes:
# intended as a replacement for ListeningPointBravo
- type: pointOfInterest
  id: Jupiter
  parent: BaseMobilePOI
  name: 'Разрушенный Крейсер Юпитер' # LuaM: 'PDV Jupiter Class Carrier' > 'Разрушенный Крейсер Юпитер'
  minimumDistance: 15000
  maximumDistance: 17500
  spawnGroup: Optional
  gridPath: /Maps/_Mono/POI/Dungeons/derelictjupiter.yml
  hideWarp: true
  addComponents:
  - type: IFF
    color: "#d1bf58"
    flags: [HideLabel]
    readOnly: false
  - type: SyndicateFOB # For pinpointer, since it needs to point to SOMETHING.
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # Dead zone
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3

- type: gameMap
  id: Jupiter
  mapName: 'Разрушенный Крейсер Юпитер' # LuaM: 'PDV Jupiter Class Carrier' > 'Разрушенный Крейсер Юпитер'
  mapPath: /Maps/_Mono/POI/Dungeons/derelictjupiter.yml
  minPlayers: 0
  stations:
    Jupiter:
      stationProto: StandardFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Разрушенный Крейсер Юпитер' # LuaM: 'PDV Jupiter Class Carrier' > 'Разрушенный Крейсер Юпитер'
        - type: StationJobs
          availableJobs: {}
        - type: StationDeadDropHintExempt
      gridComponents:
      - type: VesselInfo
        description: "Останки прославленного крейсера Авангарда, некогда разрушенного в бою с Крейсером Арктурусом. Обломки годами дрейфуют в пустоте, и с тех пор на борт никто не возвращался живым. Вы уверены, что это хорошая идея?" # LuaM: rewritten
