- type: pointOfInterest
  id: BeaconClusterA
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Астероидное скопление INSO-357k' # LuaM: 'INSO-357k Asteroid Cluster' > 'Астероидное скопление INSO-357k'
  minimumDistance: 0
  maximumDistance: 100
  posX: 5056
  posY: 4480
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/beaconstation_a.yml
  addComponents:
  - type: IFF
    color: "#ccaa55"
  - type: SolarPoweredGrid
    doNotCull: true
  - type: MapRadiusIndicator # LuaM: asteroid spawn area on the shuttle map
    center: 5120, 4544
    radius: 960

- type: gameMap
  id: BeaconClusterA
  mapName: 'Астероидное скопление INSO-357k' # LuaM: 'INSO-357k Asteroid Cluster' > 'Астероидное скопление INSO-357k'
  mapPath: /Maps/_Mono/POI/beaconstation_a.yml
  minPlayers: 0
  stations:
    BeaconClusterA:
      gridComponents: # LuaM
      - type: VesselInfo
        description: "Богатое рудой скопление астероидов. Маяк помечает его для шахтёров сектора."
      stationProto: RecordsFrontierOutpost
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Астероидное скопление INSO-357k' # LuaM: 'INSO-357k Asteroid Cluster' > 'Астероидное скопление INSO-357k'

