- type: pointOfInterest
  id: HeliosFortress
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Крепость «Гелиос»' # LuaM: 'PDV Helios Fortress' > 'Крепость «Гелиос»'
  minimumDistance: 22000
  maximumDistance: 27000 # somewhere in far reaches 1 or 2
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueTSF, MonoRogueUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce, MonoChimeraTsfPdv ] # LuaM: MonoChimeraPdv > MonoChimeraTsfPdv
  spawnGroup: Required
  gridPath: /Maps/_LuaM/POI/pdvheliosLuaM.yml # LuaM: /Maps/_Mono/POI/pdvhelios.yml > /Maps/_LuaM/POI/pdvheliosLuaM.yml
  addComponents:
  - type: MapRadiusIndicator # LuaM: faction zone on the shuttle map
    radius: 500
    color: "#DE9E59"
    fillAlpha: 0.015
    outlineAlpha: 0.15
    hideWithRadarStealth: true
  - type: IFF
    color: "#DE9E59"
    readOnly: true # mono
    flags:
    - HideLabelAlways # hidden
  - type: FriendlyIff # LuaM: the Vanguard always sees Helios
    group: PDV
    alwaysVisible: true
  - type: RadarStealthField # LuaM: hidden from non-Vanguard radars farther than 3 km, hides shuttles within 256 m
    revealRange: 3000
    fieldRadius: 256
  - type: Company # LuaM: faction outpost
    companyName: PDV
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # drones no droning
    - maxDistance: 5000
      prob: 0.0
    - maxDistance: 6500
      prob: 0.3

- type: gameMap
  id: HeliosFortress
  mapName: 'Крепость «Гелиос»' # LuaM: 'PDV Helios Fortress' > 'Крепость «Гелиос»'
  mapPath: /Maps/_LuaM/POI/pdvheliosLuaM.yml # LuaM: /Maps/_Mono/POI/pdvhelios.yml > /Maps/_LuaM/POI/pdvheliosLuaM.yml 
  minPlayers: 0
  stations:
    HeliosFortress:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
      - type: VesselInfo
        description: "Крепость, годами служившая Авангарду Нордфолла. Её орудия стерегут рубежи Империи Феникс от тех, кто посмеет посягнуть на священную землю." # LuaM: "An oppressive imperial aura lurks here. Glory to the Sultan." > translated
      - type: JamDeathrattles
        exclusions:
        - FreelanceTrackingImplant
      - type: JamOverwatch
        excludedFactions:
        - PDV
      - type: ApplyIFFFlagsToDockedShips
        flags:
        - HideLabelAlways # hide all docked ships
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Крепость «Гелиос»' # LuaM: 'PDV Helio Fortress' > 'Крепость «Гелиос»'
        - type: ExtraStationInformation
          icon: /Textures/_NF/Interface/Pirate/piratelogo.png
          stationSubtext: 'frontier-lobby-pirate-subtext'
          stationDescription: 'frontier-lobby-pirate-description'
        - type: StationJobs
          availableJobs:
            # PdvCivilian: [ -1, -1 ]
            PirateCaptain: [ 1, 1 ]
            PirateFirstMate: [ 1, 1 ]
            PDVTarkhan: [ 1, 1 ] # LuaM
            PDVDenasvar: [ 3, 3 ]
            PDVInfiltrator: [ 1, 1 ] # LuaM: uncommented, [ 2, 2 ] > [ 1, 1 ]
            Pirate: [ -1, -1 ]
            PdvBorg: [ 2, 2 ]
          tags:
          - GrandVizier
        - type: StationDeadDropReporting
          messageSet: Pirate
        - type: StationDeadDropHintExempt

