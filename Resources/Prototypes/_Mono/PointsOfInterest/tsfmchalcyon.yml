- type: pointOfInterest
  id: TSFMCHalcyon
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Флагман TSF-113 «Халкион»' # LuaM: 'TSFMC Flagship Halcyon' > 'Флагман TSF-113 «Халкион»'
  minimumDistance: 2500 # Mono
  maximumDistance: 3500 # Mono
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueTSF, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce, MonoChimeraTsfPdv ] # LuaM: MonoChimeraTsf > MonoChimeraTsfPdv
  spawnGroup: Required
  gridPath: /Maps/_LuaM/POI/tsfmchalcyonLuaM.yml # LuaM: /Maps/_Mono/POI/tsfmchalcyon.yml > /Maps/_LuaM/POI/tsfmchalcyonLuaM.yml
  addComponents:
  - type: MapRadiusIndicator # LuaM: faction zone on the shuttle map
    radius: 500
    color: "#047abd"
    fillAlpha: 0.15
    outlineAlpha: 0.35
  - type: IFF
    color: "#047abd"
    readOnly: true
  - type: Company # LuaM: faction outpost
    companyName: TSF
  - type: SolarPoweredGrid
    doNotCull: true
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # Dead zone
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3

- type: gameMap
  id: TSFMCHalcyon
  mapName: 'Флагман TSF-113 «Халкион»' # LuaM: 'TSFMC Flagship Halcyon' > 'Флагман TSF-113 «Халкион»'
  mapPath: /Maps/_LuaM/POI/tsfmchalcyonLuaM.yml # LuaM: /Maps/_Mono/POI/tsfmchalcyon.yml > /Maps/_LuaM/POI/tsfmchalcyonLuaM.yml
  minPlayers: 0
  randomRotation: false
  stations:
    TSFMCHalcyon:
      stationProto: SecurityFrontierOutpost
      gridComponents:
      - type: VesselInfo
        description: "Бывший флагман Транс-Солнечной Федерации, давно списанный с действительной службы. Был отправлен в сектор Колосс и развёрнут как мобильная база Корпуса морской пехоты ТСФ для 113-й бригады." # LuaM: "A mothballed battleship-turned-FOB, and Home of the TSFMC operations." > translated
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Флагман TSF-113 «Халкион»' # LuaM: 'TSFMC Flagship Halcyon' > 'Флагман TSF-113 «Халкион»'
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Decoration/banner.rsi
            state: nfsd-banner
          stationSubtext: 'frontier-lobby-nfsd-subtext'
          stationDescription: 'frontier-lobby-nfsd-description'
          lobbySortOrder: 2
        - type: StationJobs
          availableJobs:
            #TsfCivilian: [ -1, -1 ]
            Sheriff: [ 1, 1 ]
            Bailiff: [1, 1 ]
            TsfMarsoc: [ 1, 1 ] # LuaM
            SeniorOfficer: [ 3, 3 ] # Mono
            Brigmedic: [ 2, 2 ] # Mono
            Deputy: [ -1, -1 ] # Mono
            TsfEngineer: [ 2, 2 ]
            TsfBorg: [ 2, 2 ]
          tags:
          - HeadOfPersonnel
          - HeadOfSecurity
        - type: StationDeadDropReporting
          messageSet: Nfsd
        - type: StationDeadDropHintExempt

