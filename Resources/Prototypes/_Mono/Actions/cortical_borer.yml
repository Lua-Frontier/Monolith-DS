- type: entity
  id: ActionCorticalBorerChemMenu
  name: borer-action-chem-menu-name # LuaM-locale
  description: borer-action-chem-menu-desc # LuaM-locale
  components:
  - type: InstantAction
    icon: _Mono/Interface/Action/borer_chem.png
    event: !type:CorticalChemMenuActionEvent

- type: entity
  id: ActionCorticalBorerInfest
  name: borer-action-infest-name # LuaM-locale
  description: borer-action-infest-desc # LuaM-locale
  components:
  - type: EntityTargetAction
    useDelay: 5
    whitelist:
      components:
      - Body
    canTargetSelf: false
    interactOnMiss: false
    itemIconStyle: NoItem
    icon: _Mono/Interface/Action/borer_infest.png
    event: !type:CorticalInfestEvent {}

