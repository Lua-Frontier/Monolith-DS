- type: gameMap
  id: Frontier
  mapName: '«Целестинус Централ»' # LuaM: 'Caelestinus Central' > '«Целестинус Централ»'
  mapPath: /Maps/_Mono/Outpost/caelestinus_central.yml # Mono
  minPlayers: 0
  maxPlayers: 100
  randomRotation: true
  maxRandomOffset: 0
  stations:
    Frontier:
      stationProto: StandardFrontierStation
      gridComponents:
      - type: IFF
        color: "#37946e"
        readOnly: true # mono
      - type: StationDeadDrop
        maxDeadDrops: 2
      - type: StationCargoOrderDatabase
        capacity: 240 # has to be large to compensate for playerbase
      - type: TradeCrateDestination
        destinationProto: Trade
      - type: VesselMusic
        ambientMusicPrototype: ColossusCentralMusic
      - type: VesselInfo
        description: "Это одно из самых цивилизованных мест в секторе. Здесь безопасно. Почти." # LuaM: "The closest thing to civilization in this sector. You almost feel safe." > "Это одно из самых цивилизованных мест в секторе. Здесь безопасно. Почти."
      - type: DeleteNearbyDrones
        distance: 4000
      components:
        - type: StationNameSetup
          mapNameTemplate: '«Целестинус Централ»' # LuaM: 'Caelestinus Central' > '«Целестинус Централ»'
        - type: ExtraStationInformation
          icon: /Textures/_Mono/Logo/icon/icon-256x256.png # used the biggest one, looks better when downscaling than upscaling
          stationSubtext: 'frontier-lobby-frontier-subtext'
          stationDescription: 'frontier-lobby-frontier-description'
          lobbySortOrder: 1
        # - type: StationPlanetSpawner # Mono - Commented out planet spawner (for now)
        #   planet: DesertWorld
        #   gridPath: /Maps/_Mono/POI/surface_outpost_desert.yml
        - type: StationJobs
          availableJobs:
            Contractor: [ -1, -1 ]
            # Pilot: [ -1, -1 ]
            # Mercenary: [ -1, -1 ]
            Borg: [ -1, -1 ]
            StationRepresentative: [ 1, 1 ]
            #StationTrafficController: [ 2, 2 ]
            SecurityGuard: [ 6, 6 ] # LuaM: 3, 3 > 6, 6
            #CCServiceWorker: [ 2, 2 ]
            #NFJanitor: [ 2, 2 ]
            #MailCarrier: [ 2, 2 ]
            # DirectorOfCare: [ 1, 1 ] # Commented by LuaM
            # MdMedic: [ -1, -1 ] # Commented by LuaM
          tags:
          - HeadOfPersonnel
          - HeadOfSecurity
        - type: Announcer

- type: gameMap
  id: EmptyFrontier
  mapName: Empty
  mapPath: /Maps/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardFrontierStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Empty"
