- type: vessel
  id: Mock
  parent: BaseVessel
  name: vessel-mock-name # LuaM-locale
  description: vessel-mock-desc # LuaM-locale
  limit: 4
  price: 13500
  purchasable: false #voucher only
  category: Small
  group: Custom
  mapchecker_group_override: Shipyard  # Treat this as a Shipyard vessel for mapchecker purposes
  shuttlePath: /Maps/_Mono/Shuttles/Carrier/mock.yml
  guidebookPage: Null
  class:
  - Pursuit
  - Fighter
  engine:
  - APU

- type: gameMap
  id: Mock
  mapName: 'Mock'
  mapPath: /Maps/_Mono/Shuttles/Carrier/mock.yml
  minPlayers: 0
  stations:
    Mock:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Mock PDV{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs: {}
