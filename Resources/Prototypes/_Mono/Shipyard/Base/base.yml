# Separating this for ease of visualization
- type: vessel
  id: BaseVessel
  abstract: true
  name: vessel-base-name # LuaM-locale
  description: vessel-base-desc # LuaM-locale
  price: 50000
  category: Medium
  group: Shipyard
  addComponents:
  - type: IFF
    color: '#FFFFFFFF'
    flags: [IsPlayerShuttle]

- type: vessel
  id: BaseVesselAntag
  abstract: true
  parent: BaseVessel
  addComponents:
  - type: IFF
    flags: [IsPlayerShuttle, HideLabel, AlwaysShowColor] # LuaM add: AlwaysShowColor
