  shuttlePath: /Maps/_LuaM/Shuttles/TSFMC/sentinel.yml # LuaM: /Maps/_Mono/Shuttles/Nfsd/sentinel.yml > /Maps/_LuaM/Shuttles/TSFMC/sentinel.yml
