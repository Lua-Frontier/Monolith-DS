
- type: entity
  id: LaserDrillBase
  parent: BaseMachine
  abstract: true
  components:
  # LuaM-start: contextual equipment guide.
  - type: GuideHelp
    guides:
    - ColossusLaserDrill # LuaM: help follows the dedicated operation guide
  # LuaM-end
  - type: ItemMiner
    proto: SpawnLootOres15
    interval: 10
    needApcPower: false
  - type: Sprite
    offset: 0,0.5
    noRot: true
    sprite: _Mono/Structures/Machines/laserdrill.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unlit
      shader: unshaded
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.40,0.40,0.40"
        density: 750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PointLight
    radius: 0.8
    energy: 0.5
    color: "#00AACC"
  - type: PowerConsumer
    voltage: High
    drawRate: 50000
  - type: PowerConsumerMiner
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower

- type: entity
  id: LaserDrill
  name: automated laser drill
  parent: LaserDrillBase
  description: A large automated drill that digs up random materials when powered with 100 kW of HV. Only works on expedition planets. # LuaM: 50 kW > 100 kW
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusLaserDrill
  # LuaM-end
  - type: PlanetMiner
    requireExpedition: true
    requireGround: false # works just fine on lattice
  # LuaM start: five times slower mining, twice the power draw
  - type: ItemMiner
    interval: 50 # LuaM: 10 > 50
  - type: PowerConsumer
    voltage: High
    drawRate: 100000 # LuaM: 50000 > 100000
  # LuaM end

- type: entity
  id: StationLaserDrill
  name: advanced automated laser drill
  parent: LaserDrillBase
  description: A large bluespace automated drill that digs up random materials when powered with 150 kW of HV. Now works in space! You can just make out a scratched off logo starting with an embossed 'N' on the side.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusLaserDrill
  # LuaM-end
  - type: Anchorable
    flags: None # 1984
  - type: ItemMiner
    interval: 1 # previously 20
  - type: PowerConsumer
    voltage: High
    drawRate: 150000

- type: entity
  name: random ores
  id: SpawnLootOres15
  parent: MarkerBasePlaceFree
  suffix: "Laser Drill, 15"
  components:
  - type: Sprite
    layers:
    - state: green
      scale: 0.7, 0.7
    - sprite: Objects/Materials/ore.rsi
      state: plasma
    - sprite: _NF/Markers/general.rsi
      state: questionmark
      color: red
  # LuaM-start: weighted ore table. Weights are hundredths of a percent and add up to 10000.
  # Keep them whole: the weighted pick sums floats and throws if the running total falls short.
  - type: EntityTableSpawner
    offset: 0.0
    table: !type:GroupSelector
      children:
      - id: Coal15
        weight: 2000
      - id: Salt15
        weight: 1500
      - id: SteelOre15
        weight: 1000
      - id: UraniumOre15
        weight: 250
      - id: PlasmaOre15
        weight: 250
      - id: GoldOre15
        weight: 881
      - id: SilverOre15
        weight: 881
      - id: SpaceQuartz15
        weight: 881
      - id: LithiumOre15
        weight: 881
      - id: CopperOre15
        weight: 881
      - !type:GroupSelector
        weight: 100
        children:
        - id: BananiumOre1
        - id: DiamondOre1
        - id: BluespaceOre1
      - !type:NoneSelector
        weight: 495
  # LuaM-end

