- type: entity
  parent: ComputerComms
  id: RogueComputerComms
  name: imperial vanguard communications computer
  description: The Imperial Vanguard's primary communications computer for issuing announcements.
  components:
  - type: Sprite
    sprite: _Mono/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      sprite: Structures/Machines/computers.rsi # LuaM
      state: computer # LuaM
    - map: ["computerLayerKeyboard"]
      sprite: Structures/Machines/computers.rsi # LuaM
      state: generic_keyboard # LuaM
    - map: ["computerLayerScreen"]
      state: comm_rogue
    - map: ["computerLayerKeys"]
      state: rogue_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [[ "Pirate" ]]
  - type: CommunicationsConsole
    title: comms-console-announcement-title-rogue
    color: "#c90a0a" # LuaM: D2B48C > c90a0a
    canShuttle: false
    global: true #announce to everyone they're about to fuck shit up
    sound: /Audio/Announcements/announce.ogg
  - type: ConsoleWarDeclarator # LuaM
    faction: PDV
    warDeclarationMessage: comms-console-war-declaration-pdv
    warDeclarationSound: /Audio/_LuaM/WarDeclaration/war-pdv.ogg
  - type: Computer
    board: RogueCommsComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#D2B48C"
