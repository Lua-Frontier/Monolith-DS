  categories: [ HideSpawnMenu ]
  components:
  - type: NightVision # LuaM edit start
    relayOverlay: true
    goggleEffect: true
    viewCircleRadius: 880
    viewCircleCount: 1
    viewCircleSpacing: 1
    action: ActionToggleNightVision
    phosphorColor: "#337a98"
    lightingColor: "#ffffff52" # LuaM edit end

