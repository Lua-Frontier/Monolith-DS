- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, ShowMedicalIcons]
  id: ClothingHeadHelmetHardsuitTrauma
  name: armed trauma unit T-23 tacsuit helmet
  description: The standard combat suit of the Armed Trauma Unit, outfitted with a limited-range radar hud as well as a medical hud.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/trauma.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/trauma.rsi
  - type: PointLight
    color: "#d4c57b"
    radius: 5 # 5->6 Mono
    energy: 2 # 2->3 Mono
# LuaM start
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    viewCircleRadius: 1000
    viewCircleCount: 3
    viewCircleSpacing: 280
    action: ActionToggleNightVision
    phosphorColor: "#337a98"
    lightingColor: "#0EFFFFFF"
    amplification: 1.0
# LuaM end
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: RadarConsole
    followEntity: true
    noRotate: true
  - type: DetectionRangeMultiplier
    infraredMultiplier: 0.5
    visualMultiplier: 0.75
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9 # LuaM: 0.95 > 0.9
        Slash: 0.9 # LuaM: 0.95 > 0.9
        Piercing: 0.9 # LuaM: 0.95 > 0.9
        Heat: 0.9 # LuaM: 0.95 > 0.9
  - type: HideLayerClothing
    slots:
    - Hair
    - Special
    - FacialHair
    - Snout
    - Head
    - HeadTop
    - HeadSide

- type: entity
  parent: [ ClothingHeadHardsuitBase, ShowMedicalIcons, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitTraumaLeader
  name: armed trauma unit T-53 tacsuit helmet
  description: The commander's tacsuit in the Armed Trauma Unit, outfitted with a medical and long-range radar hud as well as thermals and night vision.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/trauma_leader.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/trauma_leader.rsi
  - type: PointLight
    radius: 6 # 5->6 Mono
    energy: 3 # 2->3 Mono
    color: "#00ffff"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
# LuaM start
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    viewCircleRadius: 1000
    viewCircleCount: 3
    viewCircleSpacing: 280
    action: ActionToggleNightVision
    phosphorColor: "#337a98"
    lightingColor: "#0EFFFFFF"
    amplification: 1.0
# LuaM end
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 3
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: RadarConsole
    followEntity: true
    noRotate: true
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: HideLayerClothing
    slots:
    - Hair
    - Special
    - FacialHair
    - Snout
    - Head
    - HeadTop
    - HeadSide
