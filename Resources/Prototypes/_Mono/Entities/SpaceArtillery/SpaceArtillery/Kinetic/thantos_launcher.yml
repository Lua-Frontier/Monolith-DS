# Station one w/ infinite ammo

- type: entity
  id: WeaponTurretThanatos
  name: THANATOS twin mass driver
  parent:
  - BallisticArtilleryUnanchorable
  - BallisticArtilleryTier5HP
  suffix: Station, T5
  description: The charon's mean older brother, the Thanatos is a force to be reckoned with. It can be remotely activated or linked up to a GCS. This one feeds from an autoloader somewhere, and doesn't need manual reloads.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCatalogueShipWeapons
  # LuaM-end
  - type: StaticPrice
    price: 120000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/thanatos.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl #I'm not certain why a station only gun has it in the description.
  - type: Gun
    fireRate: 0.1
    recoil: 2500 # 100x
    minAngle: 0
    maxAngle: 0
    burstCooldown: 20
    burstFireRate: 2
    shotsPerBurst: 2
    selectedMode: Burst
    availableModes: Burst
    projectileSpeed: 1100
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/leviathan_fire.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 350
  - type: SpaceArtillery
    powerChargeRate: 350
    powerUsePassive: 1000
    powerUseActive: 7500
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipRailgunProjectile
    fireCost: 1500
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45" # LuaM: -0.6,-0.6,0.6,0.6 > -0.45,-0.45,0.45,0.45, fits a one tile doorway
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: RadarBlip
    radarColor: "#CF0E0E"
    scale: 3
    visibleFromOtherGrids: true
    gridConfig:
      color: "#CF0E0E"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-3,-3,3,3"
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Superheavy
  - type: ShipRepairable
    repairTime: 60
    repairCost: 300
  - type: HardpointAnchorableOnly
    class: Ballistic
    size: Superheavy
  # LuaM-start: 24 fire control points instead of the 12 of its weapon class
  - type: FireControllable
    processingPowerCost: 24
  # LuaM-end


# If someone wants to make a ship version go nuts, but be SURE it uses ammo
