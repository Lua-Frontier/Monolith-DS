# inf ammo for ads/station

- type: entity
  id: WeaponTurretTarnyxBase # LuaM: WeaponTurretTarnyx > WeaponTurretTarnyxBase, shared with the movable crafted version
  abstract: true # LuaM
  name: ADBX-31 TARNYX 90mm EMP Cannon
  parent:
  - BallisticArtilleryBase # LuaM: BallisticArtilleryUnanchorable > BallisticArtilleryBase, RequiresGrid moved to WeaponTurretTarnyx
  - BallisticArtilleryTier3HP
  suffix: Station, Recharging Ammo, EMP
  description: A heavy EMP cannon made by Aetherion Dynamics, designed to disable large sections of enemy ships with a single, powerful shot. Effective in asymmetric combat. Can be remotely activated or linked up to a GCS.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusCatalogueShipWeapons
  # LuaM-end
  - type: StaticPrice
    price: 10000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/tarnyx.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Gun
    fireRate: 0.1
    projectileSpeed: 500 # LuaM: 400 > 500
    shootThermalSignature: 8000000 # ~2.8km after firing - relatively low
    soundGunshot:
      collection: ShipGunGenericBig
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 214
  - type: SpaceArtillery
    powerChargeRate: 214
    powerUsePassive: 3500
    powerUseActive: 0
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipTarnyxProjectile
    fireCost: 150
  - type: RadarBlip
    radarColor: "#035EFC"
    scale: 2.5
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Heavy
  - type: ShipRepairable
    repairTime: 30
    repairCost: 100
  # - type: HardpointAnchorableOnly # Commented by LuaM: only superheavy weapons need a hardpoint
  #   class: Ballistic
  #   size: Medium

# limited ammo for ships

- type: entity
  id: WeaponTurretTarnyxReloadBase # LuaM: WeaponTurretTarnyxReload > WeaponTurretTarnyxReloadBase, shared with the movable crafted version
  abstract: true # LuaM
  name: ADBX-31 TARNYX 90mm EMP Cannon
  parent: [BallisticArtilleryBaseCartridge, BallisticArtilleryTier3HP] # LuaM: added BallisticArtilleryTier3HP; BallisticArtilleryUnanchorableCartridge > BallisticArtilleryBaseCartridge, RequiresGrid moved to WeaponTurretTarnyxReload
  suffix: Medium, T2 - Infinite EMP
  description: A heavy EMP cannon made by Aetherion Dynamics, designed to disable large sections of enemy ships with a single, powerful shot. Effective in asymmetric combat. Can be remotely activated or linked up to a GCS.
  components:
  - type: StaticPrice
    price: 10000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/tarnyx.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Gun
    fireRate: 0.1
    projectileSpeed: 500 # LuaM: 400 > 500
    shootThermalSignature: 8000000 # ~2.8km after firing - relatively low
    soundGunshot:
      collection: ShipGunGenericBig
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: SpaceArtillery
    powerChargeRate: 200
    powerUsePassive: 3500
    powerUseActive: 0
  - type: Actions
  - type: RadarBlip
    radarColor: "#035EFC"
    scale: 2.5
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Heavy
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - 150mmShell
    capacity: 3
    infiniteUnspawned: true
    proto: 150mmEmpShell
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: ShipRepairable
    repairTime: 30
    repairCost: 100
  # - type: HardpointAnchorableOnly # Commented by LuaM: only superheavy weapons need a hardpoint
  #   class: Ballistic
  #   size: Medium

- type: entity
  id: WeaponTurretTarnyxReloadAPBase # LuaM: WeaponTurretTarnyxReloadAP > WeaponTurretTarnyxReloadAPBase, shared with the movable crafted version
  abstract: true # LuaM
  name: GS-001 EQUINOX 90mm AP Cannon
  parent: WeaponTurretTarnyxReloadBase # LuaM: WeaponTurretTarnyxReload > WeaponTurretTarnyxReloadBase
  suffix: Ship, Infinite Standard AP Ammo
  description: A knockoff heavy cannon made by GS, unlike the ABDX-31, it automatically loads AP shells. Effective in asymmetric combat. Can be remotely activated or linked up to a GCS.
  components:
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/equinox.rsi
    layers:
    - state: space_artillery
  - type: Gun
    fireRate: 0.1 # 3.96 rpm > 4.5
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - 150mmShell
    capacity: 3
    infiniteUnspawned: true
    proto: 150mmApShell
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: ShipGunType
    shipType: Ballistic
  # - type: HardpointAnchorableOnly # Commented by LuaM: only superheavy weapons need a hardpoint
  #   class: Ballistic
  #   size: Medium

# LuaM-start: mapped guns stay bolted to the grid, the movable crafted ones are in _LuaM/Entities/SpaceArtillery/movable.yml
- type: entity
  id: WeaponTurretTarnyx
  parent: WeaponTurretTarnyxBase
  suffix: Station, Recharging Ammo, EMP, Bolted
  components:
  - type: RequiresGrid

- type: entity
  id: WeaponTurretTarnyxReload
  parent: WeaponTurretTarnyxReloadBase
  suffix: Medium, T2 - Infinite EMP, Bolted
  components:
  - type: RequiresGrid

- type: entity
  id: WeaponTurretTarnyxReloadAP
  parent: WeaponTurretTarnyxReloadAPBase
  suffix: Ship, Infinite Standard AP Ammo, Bolted
  components:
  - type: RequiresGrid
# LuaM-end
