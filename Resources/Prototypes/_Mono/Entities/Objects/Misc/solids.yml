- type: entity
  name: fentanyl crystal
  parent: BaseItem
  id: FentanylSolidified
  description: 25u of Fentanyl solidified with Tricordrazine. Worth a lot.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/fentanyl.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 10000 # worth a lot but expensive to make
  - type: Food
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Fentanyl
          Quantity: 25
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # LuaM-start: the crystal rots away in 2 minutes unless it is kept in a fridge
  - type: Perishable
    rotAfter: 115 # the last 5 seconds are the first tick of the rotting itself
    molsPerSecondPerUnitMass: 0
  - type: RotInto # no entity, nothing is left of it
    stage: 0
  - type: Tag
    tags:
    - FentanylCrystal # fits in smart fridges
  # LuaM-end
  - type: PirateBountyItem
    id: FentanylCrystal
  - type: ItemTax # Mono
    taxAccounts:
      Medical: -0.05
      nfsd: -0.3 # LuaM: -0.1 > -0.3, TSF contraband fines tripled
      BlackMarket: 0.25
  - type: ExtendDescription
    descriptionList:
    - description: extend-desc-fine-tsf-reward-pdv # LuaM
      color: "#4f94ad"
      requireDetailRange: true
