# Corpo War .45 Mag Vector
# LuaM-start
- type: entity
  name: NTSF-HCLM-45 (.45 ACP)
  parent: [BaseWeaponSubMachineGun, BaseFactionGearOtherFactionT3]
  id: WeaponSubMachineGunVectorNtsfHclm
  description: The NTSF Heavy Caliber Light Machinegun. A very high-quality heavy SMG chambered in .45 ACP for use for the Nano Trasen Security Force and NT spec-ops, from the corporate war.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/SMGs/ntsf_hclm_45.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/SMGs/ntsf_hclm_45.rsi
  - type: Gun
    minAngle: 2
    maxAngle: 12
    damageModifier: 1.1
    fireRate: 6
    selectedMode: FullAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/dmr.ogg
    availableModes:
    - SemiAuto
    - FullAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine45_ACPPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine45_ACPPistolFMJ
          - Magazine45_ACPPistolHighCapacityFMJ
          - Magazine45_ACPSubMachineGunFMJ
      gun_chamber:
        name: Chamber
        startingItem: Cartridge45_ACPFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge45_ACPFMJ
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: LaserPointer
    targetedColor: "#03c2fc"
    defaultColor: "#03c2fc"
# LuaM-end
