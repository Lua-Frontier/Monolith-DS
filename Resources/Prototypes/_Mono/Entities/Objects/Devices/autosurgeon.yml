  description: A flatpack used for constructing a PDV autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonIASPDV
  - type: StaticPrice
    price: 4000
  - type: Sprite
    layers:
    - state: medical_lathe


# Dermal armor

- type: entity
  parent: BaseAutosurgeonMieyo
  id: AutosurgeonDermalArmorPDV
  name: PDV autosurgeon (E-SAPI dermal armor)
  description: Implants an array of E-SAPI armor plates into the body. Makes you more vulnerable to heat and shock, but makes you more resistant to bullets.
  components:
  - type: AutoSurgeon # LuaM: the armor is an organ in the subdermal armor slot now
    targetBodyPart: Torso
    targetOrgan: Subdermal
    newPartProto: OrganDermalArmorPDV

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonDermalArmorPDVFlatpack
  name: PDV autosurgeon (E-SAPI dermal armor) flatpack
  description: A flatpack used for constructing a PDV autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonDermalArmorPDV
  - type: StaticPrice
    price: 2500
  - type: Sprite
    layers:
    - state: medical_lathe

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonAdvHeartPDV
  name: PDV autosurgeon (VV/KE prosthetic heart)
  description: Replaces the heart with a more powerful one. Lets you process reagents faster and take more damage before going down, but lowers your stamina and processes medicine slower.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Heart
    newPartProto: OrganPDVAdvancedHeart

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonAdvHeartPDVFlatpack
  name: PDV autosurgeon (VV/KE prosthetic heart) flatpack
  description: A flatpack used for constructing a PDV autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonAdvHeartPDV
  - type: StaticPrice
    price: 3000
  - type: Sprite
    layers:
    - state: medical_lathe

