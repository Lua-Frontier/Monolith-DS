# Mantis blades
# LuaM: the right and left autosurgeons are merged, the blades now go into the arm implant slot of both arms

- type: entity
  parent: BaseAutosurgeonMieyo
  id: AutosurgeonMantisBladesMieyo
  name: MMC autosurgeon (mantis blades)
  description: Implants a pair of covert deployable mantis blades into both of your arms. That's really cool.
  components:
