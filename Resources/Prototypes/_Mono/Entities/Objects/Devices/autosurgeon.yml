# TSF

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonSandevistanTSF
  name: TSF autosurgeon (WJY-21X sandevistan)
  description: Wires a reverse-engineered MMC Sandevistan into the central nervous system. Doesn't cool down as fast as the real thing.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Cns # LuaM: Heart > Cns
    newPartProto: OrganCNSTSFSandevistan

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonSandevistanTSFFlatpack
  name: TSF autosurgeon (WJY-21X sandevistan) flatpack
  description: A flatpack used for constructing a TSF autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonSandevistanTSF
  - type: StaticPrice
    price: 15000
  - type: Sprite
    layers:
    - state: medical_lathe

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonShuntTSF
  name: TSF autosurgeon (KR-22 shunt device)
  description: Wires a highly experimental shunt device into the central nervous system. Thats some scary tech.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Cns # LuaM: Heart > Cns
    newPartProto: OrganCNSTSFShunt

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonShuntTSFFlatpack
  name: TSF autosurgeon (KR-22 shunt device) flatpack
  description: A flatpack used for constructing a TSF autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonShuntTSF
  - type: StaticPrice
    price: 50000
  - type: Sprite
    layers:
    - state: medical_lathe

# PDV

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonIASPDV
  name: PDV autosurgeon (LS-210 IAS)
  description: Replaces the lungs with an advanced internal-air-system. Capable of filtering out most atmos gases and increasing respiratory efficiency greatly.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Lungs
    newPartProto: OrganInternalAirSystem

