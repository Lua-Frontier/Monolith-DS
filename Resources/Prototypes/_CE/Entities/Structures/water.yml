# Ported from CrystalEdge
- type: entity
  id: CEWater
  name: water
  description: You're definitely going to get your feet wet.
  placement:
    mode: SnapgridCenter
  components:
  - type: PlacementReplacement
    key: floorTile
  - type: Transform
    anchored: true
#  - type: FloorOccluder # LuaM
  # LuaM-start
  - type: LuaMWater
    depth: 7
    vehicleSpeedFactors:
      Weak: 0.4
      Light: 0.55
      Medium: 0.7
      Heavy: 0.85
  # LuaM-end
  - type: Clickable
  - type: SyncSprite
  - type: Sprite
    sprite: _CE/Structures/Nature/water.rsi
    state: static
    drawdepth: Puddles
  - type: CEIconSmooth
    key: floorTile
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
      # LuaM-start: | fishing
      fishing:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        layer:
        - ItemMask
        mask:
        - HighImpassable
        density: 1000
        hard: false
      # LuaM-end
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999
        reagents:
        - ReagentId: Water
          Quantity: 9999999
  - type: SolutionRegeneration
    solution: pool
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 100
  - type: DrainableSolution
    solution: pool
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
      - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:ExtinguishReaction
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
    priority: -1 # LuaM: catwalks, carpets and tables over the water are heard instead
    barefoot: true # LuaM: splashes under bare feet too
  - type: CESafeFalling
  - type: AmbientSound
    volume: 5
    range: 4
    sound:
      path: /Audio/_CE/Ambience/water.ogg
  # LuaM-start: | fishing
  - type: FishingSpot
    fishList: !type:NestedSelector
      tableId: WaterFishingLootTable
    fishDefaultTimer: 25.0
    fishTimerVariety: 15.0
  # LuaM-end

- type: entity
  parent: CEWater
  id: CEWaterMoving
  suffix: Moving
  components:
  - type: Sprite
    state: moving
    snapCardinals: false

- type: entity
  parent: CEWater
  id: CEWaterCrocus
  suffix: Crocus
  components:
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.2
    sprintSpeedModifier: 0.2
  - type: DamageContacts
    damage:
      types:
        Asphyxiation: 5 # Dont leave me yo
