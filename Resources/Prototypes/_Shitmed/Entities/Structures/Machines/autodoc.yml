# Basic Autodoc and AutodocSyndie entity prototypes
# These are placeholder definitions to resolve the reference errors

- type: entity
  id: Autodoc
  parent: [BaseMachine, ConstructibleMachine]
  name: autodoc
  description: This is an autodoc. It's empty. You built it. Why?
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - ColossusSurgery
  # LuaM-end
  - type: Sprite
    sprite: Structures/Machines/scanner.rsi
    snapCardinals: true
    layers:
    - state: open
      map: [machineLayer]
    - state: idle_unlit
      map: [terminalLayer]
  - type: Machine
    board: AutodocCircuitboard

- type: entity
  id: AutodocSyndie
  parent: Autodoc
  name: syndicate autodoc
  description: This is an autodoc. It's empty. You built it. Why?
  components:
  - type: Sprite
    sprite: Structures/Machines/scanner.rsi
    snapCardinals: true
    layers:
    - state: open
      map: [machineLayer]
    - state: idle_unlit
      map: [terminalLayer]
  - type: Machine
    board: AutodocSyndieCircuitboard
