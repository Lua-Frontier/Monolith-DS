- type: entity
  id: OmniThrusterLua
  parent: [BaseThruster, ConstructibleMachine]
  name: omni thruster
  description: A compact multi-vector thruster that pushes the shuttle in every direction at once.
  placement:
    mode: AlignTileAny
  components:
  - type: Tag
    tags:
    - OmniBurnAlwaysOn
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: Machine
    board: OmnidirectionalThrusterMachineCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: Thruster
    thrusterType: Omnidirectional
    baseThrust: 1000
    thrust: 2400
    angularThrustExtra: 2850
    burnShape: ["-0.3,0.5","0.7,2.2","1.7,2.2","2.3,0.5"]
    damage:
      types:
        Heat: 120
        Structural: 120
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.49,-0.49,1.49,0.49"
        density: 1750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _Lua/Structures/Shuttles/omni_thruster.rsi
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
      color: "#7962a8"
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1.85
      color: "#d5c9ee"
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
    color: "#7962a8"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15000
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:SpawnEntitiesBehavior
          spawn:
            TeslaMiniEnergyBall:
              min: 1
              max: 3
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
    - trigger:
        !type:DamageTrigger
        damage: 7500
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame
  - type: Anchorable
    flags: None
  - type: StaticPrice
    price: 5000
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#99FF99"
    scale: 1.5
    shape: diamond
    gridConfig:
      color: "#99FF99"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1.5,-0.5,1.5,0.5"
  - type: ShipRepairable
    repairCost: 2
