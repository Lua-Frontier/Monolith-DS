- type: entity
  parent: BaseStructure
  id: BaseAutosurgeon
  description: A single-use autosurgeon for replacing or upgrading your parts with cybernetic implants. Rip that station apart and make it a part of you.
  abstract: true
  components:
  # LuaM-start: contextual cybernetics guide.
  - type: GuideHelp
    guides:
    - ColossusSurgery # LuaM: shared installation instructions
  # LuaM-end
  - type: Sprite
    sprite: _Goobstation/Objects/Devices/autosurgeon.rsi
    state: icon
    noRot: true
  - type: Item
    size: Huge
  - type: AutoSurgeon
  - type: ItemToggle
    onUse: false
  - type: DoAfter
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.05"
        density: 190
        mask:
        - TableMask
  - type: Destructible # Mono
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: 0.05,-0.15
  - type: Transform
    anchored: false
    noRot: true
  - type: Anchorable
  - type: Pullable

- type: entity
  parent: [BaseAutosurgeon, BaseC3SyndicateContraband]
  id: BaseAutosurgeonSyndicate
  abstract: true
  components:
  - type: Sprite
    state: icon-syndie

# CREW (currently not used, use for testing purposes admeme etc.)

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonRightSpeedLeg
  name: autosurgeon (right S.P.E.E.D leg)
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    newPartProto: SpeedRightLeg

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonLeftSpeedLeg
  name: autosurgeon (left S.P.E.E.D leg)
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    newPartProto: SpeedLeftLeg

# SYNDICATE

# LuaM: the right and left autosurgeons are merged, the blades now go into the arm implant slot of both arms
- type: entity
  parent: BaseAutosurgeonSyndicate
  id: AutosurgeonMantisBlades
  name: syndicate autosurgeon (mantis blades)
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    organForEachPart: OrganArmMantisBlade

- type: entity
  parent: BaseAutosurgeonSyndicate
  id: AutosurgeonSandevistan
  name: syndicate autosurgeon (sandevistan)
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Cns # LuaM: Heart > Cns
    newPartProto: OrganCNSSandevistan
