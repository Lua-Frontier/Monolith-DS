- type: entity
  parent: BaseMachineCircuitboard
  id: RoboticArmCircuitboard
  name: robotic arm machine board
  description: A machine printed circuit board for a robotic arm.
  components:
  # LuaM-start: contextual guidebook route.
  - type: GuideHelp
    guides:
    - IndustryAutomation
  # LuaM-end
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: RoboticArm
    requirements:
      Manipulator: 4
    stackRequirements:
      Steel: 6
      Copper: 2
      Lithium: 2
      Cable: 5

