# Combat-Station Mechs

# Gygax
- type: entity
  id: MechGygax
  parent: [ BaseMech, CombatMech ]
  name: Gygax
  description: While lightly armored, the Gygax has incredible mobility thanks to its ability to punch through walls at high speeds.
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Specific/Mech/mecha.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: gygax
    - map: ["enum.PaperLabelVisuals.Layer"]
      sprite: Structures/Storage/Crates/labels.rsi
      state: paper
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4750 # LuaM
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Mech
    baseState: gygax
    openState: gygax-open
    brokenState: gygax-broken
    mechToPilotDamageMultiplier: 0.1 # Mono
    criticalPowerStateSpeedPenalty: 0.5 # Mono
    maxIntegrity: 1800 # LuaM
    airtight: true
    pilotWhitelist:
      components:
        - HumanoidAppearance
        - BorgChassis # Goobstation - Let borgs pilot mechs
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    damage:
      types:
        Blunt: 25
        Structural: 180
  - type: Damageable
    damageModifierSet: MechArmorMedium # Mono
  - type: CanMoveInAir
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier # Mono
    baseWalkSpeed: 2 # LuaM
    baseSprintSpeed: 3.5 # LuaM
    baseWeightlessModifier: 7.5
  - type: StaticPrice
    price: 3000
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - Gygax
    - MilitaryMechBounty # Mono
  - type: RadarBlip # Mono
    radarColor: "#E3E3E3"
    scale: 1.5
    requireNoGrid: true
    shape: square
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 3
    useSound:
      path: /Audio/Items/jaws_pry.ogg
  - type: DamageProtectionBuff # LuaM
    modifiers:
      dermal:
        id: MechProtection
        flatReductions:
          Blunt: 15
          Slash: 30
          Piercing: 35
          Heat: 10
          Structural: 32
  - type: PlateletFactories # LuaM
    intervalSeconds: 0.1
    damagePerInterval:
      types:
          Blunt: -0.3
          Slash: -0.3
          Piercing: -0.3
          Heat: -0.3
          Structural: -0.4

- type: entity
  id: MechGygaxBattery
  parent: MechGygax
  suffix: Battery
  components:
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageMedium # Mono

