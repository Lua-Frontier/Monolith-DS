- type: entity
  categories: [ DoNotMap ]
  parent: BaseItem
  id: MantisBlade
  name: mantis blade
  description: They won’t see the steel until it’s too late.
  components:
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/mantis_blade.rsi
    state: icon
  - type: MeleeWeapon
    swingLeft: true
    wideAnimationRotation: 135
    attackRate: 1.5
    clickPartDamageMultiplier: 2
    heavyPartDamageMultiplier: 1
    damage:
      types:
        Slash: 26 # LuaM: 14 > 26
        Piercing: 11 # LuaM: 7 > 11
        Structural: 50 #LuaM: 20 > 50
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: SolutionContainerManager
    solutions:
      melee:
        reagents:
        - ReagentId: Phlogiston
          Quantity: 2.5
        - ReagentId: Napalm
          Quantity: 2.5
  - type: MeleeChemicalInjector
    solution: melee
    transferAmount: 1
  - type: Tag
    tags:
    - MantisBlade
  - type: Multihit
    multihitWhitelist:
      tags:
      - MantisBlade
  - type: ChangePrefixAfterDelay
  - type: Item
    size: Ginormous
    heldPrefix: popout
  - type: Tool
    qualities:
    - Slicing
  # LuaM start: pries doors like the advanced jaws of life
  - type: Prying
    speedModifier: 3.0
    pryPowered: true
    useSound: /Audio/Items/jaws_pry.ogg
  # Reflect chance is set by MantisBladeComboSystem only while both blades are extended
  - type: Reflect
    reflectProb: 0
  - type: MantisBladeCombo
  # LuaM end
