- type: martialArt
  id: CorporateJudo
  martialArtsForm: CorporateJudo
  roundstartCombos: CorporateJudoMoves
  baseDamageModifier: 5

- type: comboList
  id: CorporateJudoMoves
  combos:
  - JudoThrow
  - JudoArmbar
  - JudoDiscombobulate # Must be below Armbar, otherwise it takes priority
  - JudoWheelThrow
  - JudoEyePoke # Must be below WheelThrow

- type: combo
  id: JudoDiscombobulate
  name: martial-arts-combo-judo-discombobulate
  martialArtsForm: CorporateJudo
  attacks:
  - Disarm
  - Grab
  event: !type:JudoDiscombobulatePerformedEvent

- type: combo
  id: JudoEyePoke
  name: martial-arts-combo-judo-eye-poke
  martialArtsForm: CorporateJudo
  attacks:
  - Disarm
  - Harm
  event: !type:JudoEyePokePerformedEvent
  extraDamage: 5

- type: combo
  id: JudoThrow
  name: martial-arts-combo-judo-throw
  martialArtsForm: CorporateJudo
  attacks:
  - Grab
  - Disarm
  event: !type:JudoThrowPerformedEvent
  paralyzeTime: 4
  staminaDamage: 5
  canDoWhileProne: false

- type: combo
  id: JudoArmbar
  name: martial-arts-combo-judo-armbar
  martialArtsForm: CorporateJudo
  attacks:
  - Disarm
  - Disarm
  - Grab
  event: !type:JudoArmbarPerformedEvent
  paralyzeTime: 5
  staminaDamage: 10

- type: combo
  id: JudoWheelThrow
  name: martial-arts-combo-judo-wheel-throw
  martialArtsForm: CorporateJudo
  attacks:
  - Grab
  - Disarm
  - Harm
  event: !type:JudoWheelThrowPerformedEvent
  staminaDamage: 120
