      content: "[mono][color=#b80000]████[/color][color=#ffd700]█[/color][color=#b80000]████[/color]\n[color=#b80000]███[/color][color=#ffd700]███[/color][color=#b80000]███[/color]\n[color=#ffd700]█████████[/color]\n[color=#b80000]█[/color][color=#ffd700]███████[/color][color=#b80000]█[/color]\n[color=#b80000]██[/color][color=#ffd700]█████[/color][color=#b80000]██[/color]\n[color=#b80000]█[/color][color=#ffd700]███[/color][color=#b80000]█[/color][color=#ffd700]███[/color][color=#b80000]█[/color]\n[color=#ffd700]██[/color][color=#b80000]█████[/color][color=#ffd700]██[/color][/mono]\n\n[head=1]СОЮЗ СОВЕТСКИХ СОЦИАЛИСТИЧЕСКИХ ПЛАНЕТ[/head]\n[head=2]МИНИСТЕРСТВО ТЯЖЁЛОГО ЗВЕЗДОСТРОЕНИЯ[/head]\n[bold]ОКБ-42 «Красная Звезда» им. С.П. Королёва[/bold]\n[italic]Сектор Каламус, Орбитальная Верфь № 7[/italic]\n\n------------------------------------------------------------\n[head=3]СОПРОВОДИТЕЛЬНЫЙ ФОРМУЛЯР К ИЗДЕЛИЮ[/head]\n[bold]Наименование судна:[/bold] КСССП «Неукротимый»\n[bold]Класс / Проект:[/bold] Шаттл дальнего радиуса Пр. Э-74205\n[bold]Состояние:[/bold] Принят государственной комиссией, готов к эксплуатации\n------------------------------------------------------------\n\n[bold]Уважаемый капитан и члены экипажа![/bold]\n\nКоллектив орбитальной верфи № 7 поздравляет вас с вводом в строй новейшего космического аппарата класса «Неукротимый». Данное судно сошло со стапелей в результате ударного труда лучших инженеров союзной компании VLT, сварщиков и монтажников нашего Союза.\n\n[bold]Напутствие от коллектива верфи:[/bold]\n\nПомните, товарищи: каждая заклёпка, каждый метр проводки и каждая пластина обшивки этого шаттла создавались с мыслью о вашей безопасности и успешном выполнении поставленных задач. Берегите вверенную вам технику, своевременно проводите регламентное обслуживание ДАМ не допускайте разгерметизации в жилых отсеках.\n\nПусть «Неукротимый» станет для вас надёжным домом среди холодных звёзд. Желаем безаварийных полётов, чистого вакуума и славных свершений во благо СССП!\n\n------------------------------------------------------------\n[italic] Главный конструктор верфи № 7:[/italic] А.В. Громовер\n\n[italic]Приставитель приёмной комиссии:[/italic] И.Н. Иванов\n[italic]Приставитель компании VLT:[/italic]Т.Л.Минака "
