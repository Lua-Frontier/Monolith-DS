    - type: Paper
      content: >-
        Официальный статус: Межпланетный конгломерат.

        Публичный профиль: Лидер в сфере планетарной кибербезопасности, разработки ИИ нового поколения и орбитальной логистики .


        Что это за компания?

        Для обывателей обитаемых миров Volpis Tech-Logistics (VTL) — это респектабельный IT-гигант с безупречной репутацией. На планетах их знают как создателей «непробиваемых» файрволов, защищающих правительственные и корпоративные базы данных.

        Для обслуживания планетарной инфраструктуры компания содержит собственный флот утилизационных шаттлов. Яркий пример — LunIR-С1, мирное гражданское судно, которое зачищает орбиты от лома, попутно проводя исследования в бортовой лаборатории РНД и оказывая помощь в мини-медблоке. 

        VTL позиционирует себя как независимый, технологичный и абсолютно безопасный для общества игрок.
